header input[type=text]{width:150px}header select{width:170px}header h1{font-size:18px;margin-right:4px}header button{min-height:32px;padding:3px 8px;font-size:14px}header{gap:6px}
#status{font-size:13px;color:#6a3a14;margin:0 0 6px;min-height:1em}
main{flex:1;min-height:0;display:grid;grid-template-columns:270px minmax(300px,1fr) minmax(360px,1.5fr);gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tafel{background:radial-gradient(ellipse at 50% 30%,var(--perg),var(--perg2));border-radius:8px;box-shadow:inset 0 0 24px #a07a4488,0 3px 8px #0008;padding:10px;overflow:auto;min-height:0}

select,input[type=text]{width:100%;padding:5px;border:1px solid #8a6434;border-radius:5px;background:#f6ead0}
button{padding:6px 10px;border:2px solid #6a4420;border-radius:6px;background:linear-gradient(#d8aa6a,#a8743c);cursor:pointer;min-height:36px}
button:active{transform:translateY(1px)}
button.an{background:linear-gradient(#7ab060,#4a7a34);color:#fff8e8;border-color:#2e5020}
.reihe{display:flex;gap:6px;align-items:center}.reihe>*{flex:1}
.zahl{display:flex;align-items:center;gap:6px}.zahl b{min-width:28px;text-align:center;font-size:18px}.zahl button{flex:0 0 40px;min-height:30px;padding:2px}

<body>
<header><h1>Haus-Baukasten</h1>
  <input id="name" type="text" title="Name des Hauses">
  <button id="neu">Neu</button><button id="beispiel">Beispiel</button>
  <select id="liste" title="Gespeicherte Häuser"><option value="">Gespeicherte Häuser …</option></select>
  <button id="speichern">Speichern</button><button id="loeschen">Löschen</button><button id="senden" title="Öffnet GitHub mit dem fertigen Haus; dort nur noch absenden">Über GitHub an Claudia senden</button><button id="herunter">Herunterladen</button>
  <button id="ladeKnopf">Datei laden</button><input id="datei" type="file" accept=".json" hidden>
</header>
<main>
<section class="tafel">
  <p id="status" role="status"></p>
  <h2>Haus</h2>
  <label>Haustyp</label><div class="reihe"><select id="typ" style="flex:2"><option value="">frei</option></select><button id="vorlage" style="flex:1" title="Setzt Größe, Bauart und Einrichtung des Haustyps; danach frei änderbar">Vorlage laden</button></div>
  <p class="hinweis" id="typhinweis" style="margin:2px 0 0"></p>
  <label>Breite (Felder)</label><div class="zahl"><button data-z="breite:-1">−</button><b id="breite"></b><button data-z="breite:1">+</button></div>
  <label>Tiefe (Felder)</label><div class="zahl"><button data-z="tiefe:-1">−</button><b id="tiefe"></b><button data-z="tiefe:1">+</button></div>
  <label>Wände</label><select id="wand"><option value="fachwerk">Fachwerk auf Bruchstein</option><option value="stein">Bruchstein</option><option value="holz">Holzbohlen</option><option value="lehm">Lehm</option></select>
  <label>Dachdeckung</label><select id="dach"><option value="schiefer">Schiefer</option><option value="schindeln">Holzschindeln</option><option value="reet">Reet</option></select>
  <label>Dachform</label><select id="dachform"><option value="sattel">Satteldach (mit Giebeln)</option><option value="walm">Walmdach (rundum geneigt)</option><option value="pult">Pultdach (eine Schräge)</option><option value="flach">Flachdach mit Brüstung</option></select>
  <label class="reihe"><span>Gauben auf dem Dach</span><input id="gauben" type="checkbox" style="flex:0 0 22px;height:22px"></label>
  <label>First</label><select id="first"><option value="x">entlang der Breite</option><option value="z">entlang der Tiefe</option></select>
  <label>Verwitterung: <span id="vw"></span></label><input id="verwitterung" type="range" min="0" max="1" step="0.25">
  <label>Geschosse</label><select id="geschosse"><option value="1">1 – nur Erdgeschoss</option><option value="2">2 – Erdgeschoss und Obergeschoss</option><option value="3">3 – Erdgeschoss und zwei Obergeschosse</option></select>
  <label class="reihe"><span>Dachboden begehbar</span><input id="dachboden" type="checkbox" style="flex:0 0 22px;height:22px"></label>
  <label class="reihe"><span>Schornstein</span><input id="schornstein" type="checkbox" style="flex:0 0 22px;height:22px"></label>
  <h2 style="margin-top:14px">Ansicht</h2>
  <div class="reihe"><button id="aussen" class="an">Außen</button><button id="innen">Innen</button></div>
  <div class="reihe" style="margin-top:6px"><button id="links">⟲ Drehen</button><button id="rechts">Drehen ⟳</button></div>
  <p class="hinweis" id="ablagehinweis">„Speichern“ merkt sich das Haus nur in diesem Browser. Fertige Häuser mit „Über GitHub an Claudia senden“ abschicken: GitHub öffnet sich, dort nur noch absenden.</p>
</section>
<section class="tafel">
  <h2>Grundriss <span style="font-size:13px">(oben = hinten, unten = vorn mit Blick zur Kamera)</span></h2>
  <div class="reihe" id="ebenen" style="margin-bottom:6px;flex-wrap:wrap"></div>
  <canvas id="plan" width="600" height="520"></canvas>
  <div class="werkzeuge" id="werkzeuge"></div>
  <p class="hinweis" id="hilfe"></p>
</section>
<section class="tafel"><h2>Vorschau aus Spielsicht</h2><canvas id="ansicht"></canvas></section>
</main>
<script src="lib/three.min.js"></script>
<script src="modelle/hausbau.js"></script>
<script>
// Haus-Baukasten: Bedienung. Häuser werden als JSON beschrieben (Format siehe Hausbau.BEISPIEL in modelle/hausbau.js).
const HB=window.Hausbau,SPEICHER='grauufer-baukasten';
const $=id=>document.getElementById(id);
const kopie=o=>JSON.parse(JSON.stringify(o));
let spec=kopie(HB.BEISPIEL),innen=false,drehung=0,werkzeug='fenster',ebene=0;
const gsOf=o=>o.geschoss|0,mitGs=o=>{if(ebene)o.geschoss=ebene;return o;};
// Ebenen: Geschosse (1–3) und auf Wunsch der Dachboden darüber
const GZ=()=>Math.max(1,Math.min(3,spec.geschosse|0||1)),DBA=()=>!!spec.dachboden&&spec.dachform!=='pult'&&spec.dachform!=='flach',LZ=()=>GZ()+(DBA()?1:0),istDach=()=>DBA()&&ebene===GZ();
const EBENEN=['Erdgeschoss','1. Obergeschoss','2. Obergeschoss'],ebName=i=>i>=GZ()?'Dachboden':EBENEN[i];
const meldung=t=>{$('status').textContent=t;};
// Ablage: im Browser (localStorage) oder – als Claude-Seite – im gemeinsamen Speicher (db), den Claudia lesen kann
const slug=n=>(n||'haus').toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')||'haus';
let Ablage={art:'browser',haeuser:{},
  lies(){try{this.haeuser=JSON.parse(localStorage.getItem(SPEICHER)||'{}');}catch(e){this.haeuser={};}},
  async speichere(sp){this.haeuser[sp.name||'Haus']=kopie(sp);try{localStorage.setItem(SPEICHER,JSON.stringify(this.haeuser));return true;}catch(e){return false;}},
  async loesche(n){delete this.haeuser[n];try{localStorage.setItem(SPEICHER,JSON.stringify(this.haeuser));}catch(e){}}};
Ablage.lies();
async function ablageStart(){if(!(window.claude&&window.claude.use))return;let db=null;try{db=await window.claude.use('db');}catch(e){}if(!db)return;
  const col=db.collection('haeuser');
  Ablage={art:'claude',haeuser:{},
    async speichere(sp){try{await col.doc(slug(sp.name)).set({name:sp.name||'Haus',spec:kopie(sp),geaendert:new Date().toISOString()});return true;}catch(e){return false;}},
    async loesche(n){try{await col.doc(slug(n)).delete();}catch(e){meldung('Löschen ging nicht.');}}};
  $('herunter').hidden=true;$('senden').hidden=true;$('ablagehinweis').textContent='„Speichern“ legt das Haus im gemeinsamen Speicher ab; Claudia kann es dort direkt abholen.';meldung('Gespeicherte Häuser sieht auch Claudia.');
  col.onSnapshot(q=>{const h={};q.docs.forEach(d=>{const x=d.data();if(x&&x.spec)h[x.name||d.id]=x.spec;});Ablage.haeuser=h;felder();},()=>meldung('Verbindung zum Speicher verloren – bitte neu laden.'));}
try{const z=localStorage.getItem(SPEICHER+'-zuletzt');if(z)spec=JSON.parse(z);}catch(e){}

// ---------- Werkzeuge ----------
const OEFF={fenster:'Fenster',tuer:'Tür',fenster_kaputt:'Fenster kaputt',fenster_vernagelt:'Fenster vernagelt',tor:'Tor',portal:'Portal',luke:'Luke'};
const TUERARTIG={tuer:1,tor:1,portal:1};
const WZ=[...Object.entries(OEFF),...Object.entries(HB.KATALOG).map(([k,v])=>[k,v.name]),['drehen','↻ Drehen'],['entfernen','✕ Entfernen']];
const HILFE={fenster:'Tippe auf eine Wand, um dort ein Fenster einzusetzen; nochmal tippen macht wieder Wand daraus.',tuer:'Tippe auf eine Wand, um dort eine Tür einzusetzen (im Grundriss mit Türblatt und Bogen); nochmal tippen macht wieder Wand daraus.',
  tor:'Tippe auf eine Wand für ein breites Tor mit zwei Flügeln (für Schuppen und Stall); nochmal tippen macht wieder Wand daraus.',portal:'Tippe auf eine Wand für ein Portal: Doppeltür mit Steinrahmen, Bogen und Stufen; nochmal tippen macht wieder Wand daraus.',luke:'Tippe auf eine Wand für eine kleine Luke mit Holzladen; nochmal tippen macht wieder Wand daraus.',
  fenster_kaputt:'Tippe auf eine Wand für ein kaputtes Fenster; nochmal tippen macht wieder Wand daraus.',fenster_vernagelt:'Tippe auf eine Wand für ein vernageltes Fenster; nochmal tippen macht wieder Wand daraus.',
  drehen:'Tippe auf ein Feld, um das Teil dort zu drehen.',treppe:'Tippe auf ein Feld: Die Treppe führt in die Ebene darüber; dort entsteht an derselben Stelle das Treppenloch mit Geländer. Erneutes Tippen dreht die Laufrichtung.',entfernen:'Tippe auf ein Feld, um alles darin zu entfernen.'};
function zeigeWerkzeuge(){$('werkzeuge').innerHTML='';const mitTreppe=ebene<LZ()-1;if((werkzeug==='treppe'&&!mitTreppe)||(OEFF[werkzeug]&&istDach()))werkzeug='bett';
  WZ.forEach(([k,n])=>{if(k==='treppe'&&!mitTreppe)return;if(OEFF[k]&&istDach())return;const b=document.createElement('button');b.textContent=n;if(OEFF[k]){const c=document.createElement('canvas');c.width=26;c.height=14;c.style.cssText='vertical-align:middle;margin-right:5px';oeffnungZeichen(c.getContext('2d'),k,1,1,24,12,'h');b.prepend(c);}b.className=k===werkzeug?'an':'';
  b.onclick=()=>{werkzeug=k;zeigeWerkzeuge();};$('werkzeuge').appendChild(b);});
  $('hilfe').textContent=HILFE[werkzeug]||`Tippe auf ein Feld, um „${HB.KATALOG[werkzeug].name}“ zu setzen, auch außen um das Haus. Je Feld ein Möbelstück`+(HB.KATALOG[werkzeug].zusatz?'; dieses Teil darf zusätzlich zu einem Möbelstück stehen':'; Teppich, Kessel, Wandbrett und Waffen dürfen dazukommen')+'. Erneutes Tippen dreht das Teil, ein anderes Möbelstück ersetzt es.';}

// ---------- Grundriss ----------
function oeffnungZeichen(g,art,x,y,w,h,dir){
  if(art==='tuer'||art==='portal'){g.fillStyle='#6a4a2a';g.fillRect(x,y,w,h);if(art==='portal'){g.fillStyle='#a8a090';g.fillRect(x,y,4,h);g.fillRect(x+w-4,y,4,h);}g.strokeStyle='#ffe2a0';g.lineWidth=2;g.beginPath();g.moveTo(x,y+h/2);g.lineTo(x+w*.8,y+h/2);g.stroke();
    g.beginPath();g.arc(x,y+h/2,w*.8,-Math.PI/2.4,0);g.stroke();return;}
  if(art==='tor'){g.fillStyle='#6a4a2a';g.fillRect(x,y,w,h);g.strokeStyle='#ffe2a0';g.lineWidth=2;g.beginPath();g.arc(x,y+h,w*.5,-Math.PI/2,0);g.stroke();g.beginPath();g.arc(x+w,y+h,w*.5,Math.PI,-Math.PI/2);g.stroke();return;}
  if(art==='luke'){g.fillStyle='#8a5a2a';g.fillRect(x+w*.2,y+h*.2,w*.6,h*.6);g.strokeStyle='#3a2410';g.lineWidth=1.5;g.strokeRect(x+w*.2,y+h*.2,w*.6,h*.6);return;}
  g.fillStyle=art==='fenster_vernagelt'?'#b08850':'#9fd0ec';g.fillRect(x,y,w,h);g.strokeStyle='#1e3a52';g.lineWidth=1.5;g.strokeRect(x+.5,y+.5,w-1,h-1);
  g.beginPath();if(dir==='h'){g.moveTo(x,y+h/2);g.lineTo(x+w,y+h/2);}else{g.moveTo(x+w/2,y);g.lineTo(x+w/2,y+h);}g.stroke();
  if(art==='fenster_kaputt'){g.strokeStyle='#111';g.lineWidth=2.5;g.beginPath();g.moveTo(x,y);g.lineTo(x+w,y+h);g.moveTo(x+w,y);g.lineTo(x,y+h);g.stroke();}
  if(art==='fenster_vernagelt'){g.strokeStyle='#5a3a1a';g.lineWidth=2;g.beginPath();for(let i=0;i<3;i++){const k=(i+.5)/3;if(dir==='h'){g.moveTo(x+w*k-3,y);g.lineTo(x+w*k+3,y+h);}else{g.moveTo(x,y+h*k-3);g.lineTo(x+w,y+h*k+3);}}g.stroke();}}
const plan=$('plan'),pg=plan.getContext('2d');let cs=40;
const KURZ={treppe:'Trep',bett:'Bett',truhe:'Tru',schrank:'Schr',regal:'Reg',kamin:'Kam',wandbrett:'Brett',waffen:'Waf',tisch:'Tisch',faesser:'Fäs',kiste:'Kis',saecke:'Sä',hocker:'Ho',teppich:'Tep',kessel:'Kes',stuhl:'Stu',besen:'Bes',brennholz:'Holz'};
function zeichnePlan(){const B=spec.breite,D=spec.tiefe,tafel=plan.parentElement,breit=tafel.clientWidth-22;
  let hoch=520;if(window.innerWidth>1000){const rest=tafel.scrollHeight-plan.offsetHeight;hoch=tafel.clientHeight-rest-8;}
  cs=Math.max(18,Math.floor(Math.min(breit/(B+2),Math.max(120,hoch)/(D+2),70)));plan.width=cs*(B+2);plan.height=cs*(D+2);
  pg.fillStyle='#5a6a34';pg.fillRect(0,0,plan.width,plan.height);
  for(let x=-1;x<=B;x++)for(let z=-1;z<=D;z++){const drin=x>=0&&x<B&&z>=0&&z<D;pg.fillStyle=drin?((x+z)%2?'#8a6438':'#94703f'):((x+z)%2?'#62723a':'#5a6a34');pg.fillRect((x+1)*cs,(z+1)*cs,cs,cs);}
  pg.strokeStyle='#3a3026';pg.lineWidth=Math.max(5,cs*.16);pg.strokeRect(cs,cs,B*cs,D*cs);
  (spec.oeffnungen||[]).filter(o=>gsOf(o)===ebene).forEach(o=>{const f=o.feld,t=Math.max(8,cs*.2),L=cs*(o.art==='tor'?.92:o.art==='luke'?.45:.7),a=(f+1+(1-L/cs)/2)*cs;let x,y,w,h,dir;
    if(o.seite==='hinten'){x=a;y=cs-t/2;w=L;h=t;dir='h';}else if(o.seite==='vorn'){x=a;y=(D+1)*cs-t/2;w=L;h=t;dir='h';}
    else if(o.seite==='links'){x=cs-t/2;y=a;w=t;h=L;dir='v';}else{x=(B+1)*cs-t/2;y=a;w=t;h=L;dir='v';}
    if(o.art==='tor'||o.art==='luke')oeffnungZeichen(pg,o.art,x,y,w,h,dir);
    else if(TUERARTIG[o.art]){// Türöffnung: Lücke in der Wand, Türblatt und Schwenkbogen ins Haus
      pg.fillStyle='#94703f';pg.fillRect(x,y,w,h);const r=L*.92;pg.strokeStyle='#ffe2a0';pg.lineWidth=Math.max(2,cs*.05);
      const ix=o.seite==='links'?1:o.seite==='rechts'?-1:0,iz=o.seite==='hinten'?1:o.seite==='vorn'?-1:0;
      const hx=dir==='h'?x:x+w/2,hz=dir==='h'?y+h/2:y,ex=hx+ix*r,ez=hz+iz*r;pg.beginPath();pg.moveTo(hx,hz);pg.lineTo(ex,ez);pg.stroke();
      pg.setLineDash([4,3]);pg.beginPath();const a0=Math.atan2(ez-hz,ex-hx),a1=Math.atan2(dir==='h'?0:L,dir==='h'?L:0);
      pg.arc(hx,hz,r,Math.min(a0,a1),Math.max(a0,a1));pg.stroke();pg.setLineDash([]);
    }
    else oeffnungZeichen(pg,o.art,x,y,w,h,dir);});
  const drinF=e=>e.x>=0&&e.x<B&&e.z>=0&&e.z<D;
  if(ebene)(spec.einrichtung||[]).filter(e=>e.art==='treppe'&&gsOf(e)===ebene-1&&drinF(e)).forEach(e=>{const px=(e.x+1)*cs,pz=(e.z+1)*cs;pg.fillStyle='rgba(20,12,4,.55)';pg.fillRect(px+3,pz+3,cs-6,cs-6);
    pg.strokeStyle='#d8b070';pg.lineWidth=2;pg.beginPath();for(let i=1;i<6;i++){const q=i/6;if(e.dreh%2){pg.moveTo(px+q*cs,pz+4);pg.lineTo(px+q*cs,pz+cs-4);}else{pg.moveTo(px+4,pz+q*cs);pg.lineTo(px+cs-4,pz+q*cs);}}pg.stroke();
    pg.font=`${Math.max(10,cs*.2)}px 'Pixelify Sans',sans-serif`;pg.fillStyle='#f6e8c8';pg.textAlign='center';pg.textBaseline='middle';pg.fillText('Loch',px+cs/2,pz+cs/2);});
  const proFeld={};(spec.einrichtung||[]).filter(e=>drinF(e)?gsOf(e)===ebene:!ebene).forEach(e=>{const k=e.x+','+e.z;(proFeld[k]=proFeld[k]||[]).push(e);});
  pg.textAlign='center';pg.textBaseline='middle';
  for(const k in proFeld){const[x,z]=k.split(',').map(Number),l=proFeld[k],cx=(x+1.5)*cs,cz=(z+1.5)*cs;
    pg.fillStyle='rgba(255,220,140,.18)';pg.fillRect((x+1)*cs+2,(z+1)*cs+2,cs-4,cs-4);
    l.forEach((e,i)=>{const yy=cz+(i-(l.length-1)/2)*cs*.26;pg.font=`${Math.max(10,cs*.21)}px 'Pixelify Sans',sans-serif`;
      pg.fillStyle='#f6e8c8';pg.strokeStyle='#2a1a0a';pg.lineWidth=3;pg.strokeText(KURZ[e.art]||e.art,cx,yy);pg.fillText(KURZ[e.art]||e.art,cx,yy);});
    const d=l[l.length-1].dreh&3,ax=[0,-1,0,1][d],az=[-1,0,1,0][d];pg.strokeStyle='#ffd070';pg.lineWidth=3;pg.beginPath();
    pg.moveTo(cx+ax*cs*.42,cz+az*cs*.42);pg.lineTo(cx+ax*cs*.3,cz+az*cs*.3);pg.stroke();}
  pg.font=`${Math.max(11,cs*.26)}px 'Pixelify Sans',sans-serif`;pg.fillStyle='#e8f0c0';
  pg.fillText('hinten',plan.width/2,cs*.45);pg.fillText('vorn',plan.width/2,plan.height-cs*.45);
  pg.save();pg.translate(cs*.45,plan.height/2);pg.rotate(-Math.PI/2);pg.fillText('links',0,0);pg.restore();
  pg.save();pg.translate(plan.width-cs*.45,plan.height/2);pg.rotate(Math.PI/2);pg.fillText('rechts',0,0);pg.restore();}
plan.addEventListener('click',ev=>{const r=plan.getBoundingClientRect(),fx=(ev.clientX-r.left)*plan.width/r.width/cs-1,fz=(ev.clientY-r.top)*plan.height/r.height/cs-1;
  const B=spec.breite,D=spec.tiefe;spec.oeffnungen=spec.oeffnungen||[];spec.einrichtung=spec.einrichtung||[];
  if(OEFF[werkzeug]){let seite=null,feld=0;const tol=.35;
    if(Math.abs(fz)<tol&&fx>0&&fx<B){seite='hinten';feld=Math.floor(fx);}else if(Math.abs(fz-D)<tol&&fx>0&&fx<B){seite='vorn';feld=Math.floor(fx);}
    else if(Math.abs(fx)<tol&&fz>0&&fz<D){seite='links';feld=Math.floor(fz);}else if(Math.abs(fx-B)<tol&&fz>0&&fz<D){seite='rechts';feld=Math.floor(fz);}
    if(!seite)return;const i=spec.oeffnungen.findIndex(o=>o.seite===seite&&o.feld===feld&&gsOf(o)===ebene),alt=i<0?'wand':spec.oeffnungen[i].art;
    if(i>=0)spec.oeffnungen.splice(i,1);if(alt!==werkzeug)spec.oeffnungen.push(mitGs({seite,feld,art:werkzeug}));}
  else{const x=Math.floor(fx),z=Math.floor(fz);if(x<-1||x>B||z<-1||z>D)return;const drin=x>=0&&x<B&&z>=0&&z<D;
    if(ebene&&!drin){meldung('Oben gibt es nur Felder im Haus.');return;}
    if(ebene&&spec.einrichtung.some(e=>e.art==='treppe'&&gsOf(e)===ebene-1&&e.x===x&&e.z===z)){meldung('Hier ist das Treppenloch.');return;}
    if(werkzeug==='treppe'&&!drin){meldung('Die Treppe muss im Haus stehen.');return;}
    const imFeld=e=>e.x===x&&e.z===z&&(drin?gsOf(e)===ebene:true),hier=spec.einrichtung.filter(imFeld);
    if(werkzeug==='drehen'){if(hier.length)hier[hier.length-1].dreh=(hier[hier.length-1].dreh+1)&3;}
    else if(werkzeug==='entfernen'){spec.einrichtung=spec.einrichtung.filter(e=>!imFeld(e));}
    else if(hier.some(e=>e.art===werkzeug)){const e=hier.find(e=>e.art===werkzeug);e.dreh=(e.dreh+1)&3;}
    else{let dreh=0;if(x<0)dreh=1;else if(x>=B)dreh=3;else if(z<0)dreh=0;else if(z>=D)dreh=2;
      else if(HB.KATALOG[werkzeug].wand){const ab=[z,x,D-1-z,B-1-x];dreh=ab.indexOf(Math.min(...ab));}
      // je Feld ein Hauptteil und ein Zusatzteil: ein Teil derselben Sorte wird ersetzt
      const zus=!!HB.KATALOG[werkzeug].zusatz;spec.einrichtung=spec.einrichtung.filter(e=>!(imFeld(e)&&!!HB.KATALOG[e.art].zusatz===zus));
      spec.einrichtung.push(drin?mitGs({art:werkzeug,x,z,dreh}):{art:werkzeug,x,z,dreh});}}
  geaendert();});

// ---------- Vorschau ----------
const ansicht=$('ansicht');let warte=0,szene=null;
try{szene=HB.Szene(ansicht);}catch(e){ansicht.insertAdjacentHTML('afterend','<p class="hinweis">Die 3D-Vorschau braucht WebGL; dieser Browser stellt es nicht bereit.</p>');}
function rendere(){if(!szene)return;const r=ansicht.getBoundingClientRect();szene.renderer.setPixelRatio(1);szene.renderer.setSize(Math.max(200,r.width|0),Math.max(200,r.height|0),false);szene.zeige(spec,innen,drehung,undefined,ebene);}
function geaendert(){if(ebene>LZ()-1)ebene=LZ()-1;zeigeWerkzeuge();spec.einrichtung=HB.bereinige(spec.einrichtung);try{localStorage.setItem(SPEICHER+'-zuletzt',JSON.stringify(spec));}catch(e){}felder();zeichnePlan();clearTimeout(warte);warte=setTimeout(rendere,120);}
function felder(){$('typ').value=spec.typ||'';$('typhinweis').textContent=spec.typ&&HB.VORLAGEN[spec.typ]?'Typisch: '+HB.VORLAGEN[spec.typ].typisch:'';$('gauben').checked=!!spec.gauben;$('gauben').disabled=spec.dachform==='pult'||spec.dachform==='flach';$('dachboden').disabled=spec.dachform==='pult'||spec.dachform==='flach';
  $('geschosse').value=String(GZ());$('dachboden').checked=!!spec.dachboden;const eb=$('ebenen');eb.hidden=LZ()<2;eb.innerHTML='';
  for(let i=0;i<LZ();i++){const b=document.createElement('button');b.textContent=ebName(i);b.className=i===ebene?'an':'';b.onclick=()=>{ebene=i;geaendert();};eb.appendChild(b);}
  $('innen').textContent=LZ()>1?'Innen ('+['EG','1. OG','2. OG'][ebene]+')':'Innen';if(istDach())$('innen').textContent='Innen (Dachboden)';$('name').value=spec.name||'';$('breite').textContent=spec.breite;$('tiefe').textContent=spec.tiefe;$('wand').value=spec.wand;$('dach').value=spec.dach;
  $('first').value=spec.first||'x';$('dachform').value=spec.dachform||(spec.dach==='reet'?'walm':'sattel');$('verwitterung').value=spec.verwitterung;$('vw').textContent=['neu','gepflegt','gebraucht','verwittert','verfallen'][Math.round(spec.verwitterung*4)];
  $('schornstein').checked=!!spec.schornstein;$('aussen').className=innen?'':'an';$('innen').className=innen?'an':'';
  const l=Ablage.haeuser;$('liste').innerHTML='<option value="">Gespeicherte Häuser …</option>'+Object.keys(l).sort().map(n=>`<option>${n.replace(/</g,'&lt;')}</option>`).join('');$('liste').value=l[spec.name]?spec.name:'';}
document.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{const[k,d]=b.dataset.z.split(':');spec[k]=Math.max(2,Math.min(12,spec[k]+ +d));
  spec.oeffnungen=spec.oeffnungen.filter(o=>o.feld<((o.seite==='hinten'||o.seite==='vorn')?spec.breite:spec.tiefe));
  spec.einrichtung=spec.einrichtung.filter(e=>e.x<=spec.breite&&e.z<=spec.tiefe);geaendert();});
['wand','dach','first','dachform'].forEach(k=>$(k).onchange=()=>{spec[k]=$(k).value;if(k==='dach')delete spec.dachform;geaendert();});
$('verwitterung').oninput=()=>{spec.verwitterung=+$('verwitterung').value;geaendert();};
$('schornstein').onchange=()=>{spec.schornstein=$('schornstein').checked;geaendert();};
$('name').onchange=()=>{spec.name=$('name').value.trim()||'Haus';geaendert();};
$('aussen').onclick=()=>{innen=false;geaendert();};
$('geschosse').onchange=()=>{spec.geschosse=+$('geschosse').value;geaendert();};
$('dachboden').onchange=()=>{spec.dachboden=$('dachboden').checked;geaendert();};
$('gauben').onchange=()=>{spec.gauben=$('gauben').checked;geaendert();};
Object.entries(HB.VORLAGEN).forEach(([k,v])=>{const o=document.createElement('option');o.value=k;o.textContent=v.name;$('typ').appendChild(o);});
$('typ').onchange=()=>{spec.typ=$('typ').value||undefined;geaendert();};
$('vorlage').onclick=()=>{const k=$('typ').value;if(!k){meldung('Erst einen Haustyp wählen.');return;}const v=HB.VORLAGEN[k];
  spec=Object.assign({name:spec.name&&spec.name!=='Neues Haus'?spec.name:v.name,typ:k},v.spec());ebene=0;meldung(`Vorlage „${v.name}“ geladen – alles lässt sich frei ändern.`);geaendert();};$('innen').onclick=()=>{innen=true;geaendert();};
$('links').onclick=()=>{drehung=(drehung+3)&3;geaendert();};$('rechts').onclick=()=>{drehung=(drehung+1)&3;geaendert();};
$('neu').onclick=()=>{spec={name:'Neues Haus',breite:4,tiefe:3,wand:'fachwerk',dach:'schiefer',first:'x',verwitterung:.5,schornstein:false,oeffnungen:[{seite:'vorn',feld:1,art:'tuer'}],einrichtung:[]};geaendert();};
$('beispiel').onclick=()=>{spec=kopie(HB.BEISPIEL);geaendert();};
$('speichern').onclick=async()=>{meldung('Speichere …');const ok=await Ablage.speichere(spec);meldung(ok?`„${spec.name}“ gespeichert.`:'Speichern ging nicht – bitte noch einmal versuchen.');felder();};
// Über GitHub an Claudia senden: öffnet ein vorausgefülltes GitHub-Issue mit der Hausbeschreibung (nur noch „Submit“ tippen)
window.hausLink=()=>{const j=JSON.stringify(spec);const body='Neues Haus aus dem Haus-Baukasten. Claudia baut es ins Spiel ein.\n\n```json\n'+j+'\n```\n';
  return'https://github.com/schnoerp/Grauufer/issues/new?title='+encodeURIComponent('Haus: '+(spec.name||'Haus'))+'&body='+encodeURIComponent(body);};
$('senden').onclick=()=>{const u=window.hausLink();if(u.length>7500){meldung('Das Haus ist zu groß für den Versand – bitte weniger Einrichtung.');return;}
  const w=window.open(u,'_blank');meldung(w?'GitHub ist geöffnet: dort auf „Create“ bzw. „Submit new issue“ tippen.':'GitHub ließ sich nicht öffnen – bitte Pop-ups erlauben.');};
let loeschFrage=0;$('loeschen').onclick=async()=>{const n=$('liste').value||spec.name;if(!Ablage.haeuser[n]){meldung('Dieses Haus ist nicht gespeichert.');return;}
  if(Date.now()-loeschFrage>4000){loeschFrage=Date.now();meldung(`„${n}“ wirklich löschen? Noch einmal tippen.`);return;}
  loeschFrage=0;await Ablage.loesche(n);meldung(`„${n}“ gelöscht.`);felder();};
$('liste').onchange=()=>{const n=$('liste').value;if(!n||!Ablage.haeuser[n])return;spec=kopie(Ablage.haeuser[n]);geaendert();};
$('herunter').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(spec,null,1)+'\n'],{type:'application/json'}));
  a.download=(spec.name||'haus').toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,'_')+'.json';a.click();};
$('ladeKnopf').onclick=()=>$('datei').click();
$('datei').onchange=async()=>{const f=$('datei').files[0];if(!f)return;try{spec=JSON.parse(await f.text());geaendert();}catch(e){meldung('Die Datei ist kein gültiges Haus.');}};
window.addEventListener('resize',()=>{zeichnePlan();clearTimeout(warte);warte=setTimeout(rendere,150);});
zeigeWerkzeuge();geaendert();ablageStart();
</script>
