<style>
:root{
  --night:#140c08; --panel:rgba(24,14,8,.93); --edge:#7a5230; --edge2:#2a1a0e; --bone:#e0d2b4; --dim:#a8967a;
  --gold:#f2b13c; --arcane:#7fc8c0;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --night:#140c08; --panel:rgba(24,14,8,.93); } }
:root[data-theme="dark"]{ --night:#140c08; --panel:rgba(24,14,8,.93); }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--night);color:var(--bone);font-family:'Pixelify Sans','Courier New',monospace;overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
[hidden]{display:none !important}
.px{text-shadow:2px 2px 0 #120804,-1px 0 0 #120804,0 -1px 0 #120804,1px 0 0 #120804}
#hud{position:fixed;top:0;left:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;pointer-events:none;max-width:calc(100% - 170px)}
#quest{margin:0;color:var(--gold);font-size:16px;line-height:1.25}
#zone,#lvl{margin:4px 0 0;color:var(--dim);font-size:14px}
#hudR{position:fixed;top:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.box{background:var(--panel);border:2px solid var(--edge);box-shadow:inset 0 0 0 2px var(--edge2);padding:5px 9px;font-size:14px;text-align:right;line-height:1.3}
#gold{color:#f0cc62}
.compass{display:flex;gap:6px}.cp{width:58px;height:62px;background:var(--panel);border:2px solid var(--edge);box-shadow:inset 0 0 0 2px var(--edge2);display:flex;flex-direction:column;align-items:center;justify-content:center}
.cp svg{width:38px;height:38px;transition:transform .25s}.cp span{font-size:12px;color:var(--gold);line-height:1;text-shadow:1px 1px 0 #000}
.zoom{display:flex;gap:6px;align-items:center}#zpct{min-width:52px;text-align:center;padding:6px 6px;font-size:14px}
.zoom button,#bSnd{min-height:36px;min-width:36px;font-size:14px;padding:0 9px}
#log{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);pointer-events:none;font-size:15px;line-height:1.3;max-width:460px}
#log div{margin-top:2px}
#log .hurt{color:#f08a70} #log .q{color:var(--gold)} #log .magic{color:var(--arcane)}
#hotbar{display:flex;gap:5px;justify-content:center;max-width:100%;overflow-x:auto}
.hk{position:relative;width:54px;height:54px;flex:none;padding:0;min-height:0;background:#1c1008;border:2px solid var(--edge);box-shadow:inset 0 0 0 2px var(--edge2)}
.hk img{width:100%;height:100%;display:block}
.hk .n{position:absolute;left:3px;top:1px;font-size:12px;color:var(--gold);text-shadow:1px 1px 0 #000}
.hk .c{position:absolute;right:3px;bottom:1px;font-size:12px;color:var(--bone);text-shadow:1px 1px 0 #000}
.hk.on{border-color:var(--gold)}.hk.cast{border-color:var(--arcane);box-shadow:0 0 10px rgba(127,200,192,.6)}
.hk[disabled]{opacity:.4}
#bottom{position:fixed;left:0;right:0;bottom:0;padding:22px 12px calc(env(safe-area-inset-bottom,0px) + 10px);
  background:linear-gradient(transparent,rgba(14,8,4,.9) 40%);display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px}
#bottom .bar{flex:1 1 120px;max-width:240px;height:26px;font-size:13px}
@media (max-width:760px){#bottom .bar{flex-basis:40%;max-width:none;order:-1}}
.vitals{display:flex;gap:8px;align-items:center;width:min(560px,100%)}
.bar{position:relative;flex:1;height:16px;background:#0c0604;border:2px solid var(--edge);overflow:hidden;font-size:12px;
  display:flex;align-items:center;justify-content:space-between;padding:0 5px}
.bar i{position:absolute;left:0;top:0;bottom:0;transition:width .2s steps(6)}
.hp i{background:repeating-linear-gradient(90deg,#b8301c 0 6px,#962414 6px 8px)}
.mp i{background:repeating-linear-gradient(90deg,#2e7a96 0 6px,#22607a 6px 8px)}
.bar span,.bar b{position:relative;font-weight:500}
#lvl{font-size:14px;color:var(--dim);white-space:nowrap}
#actions{display:flex;gap:8px;justify-content:center}
button{font:inherit;font-size:16px;color:var(--bone);background:#2c1a0e;border:2px solid var(--edge);box-shadow:inset 0 0 0 2px var(--edge2);
  min-height:44px;padding:0 14px;cursor:pointer;border-radius:0}
button:hover{background:#3a2414}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button[disabled]{opacity:.45;cursor:default}
#bSpell.on{border-color:var(--arcane);color:#d6f4f0}
#speech{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 40px;z-index:3;pointer-events:none;
  background:linear-gradient(rgba(12,6,2,.62),rgba(12,6,2,0))}
#speech .in{max-width:760px;margin:0 auto}
#who{font-size:15px;color:var(--dim);margin-bottom:4px}
#say{font-size:clamp(19px,4.7vw,30px);line-height:1.3;font-weight:500;
  background:linear-gradient(#ffdc6a 0%,#f4a636 55%,#d8741e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(2px 2px 0 #160a02) drop-shadow(-1px 0 0 #160a02) drop-shadow(0 -1px 0 #160a02)}
#choices{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(640px,100%);z-index:3;
  padding:30px 14px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;gap:2px;
  background:linear-gradient(transparent,rgba(12,6,2,.88) 32%)}
#choices button{background:none;border:none;box-shadow:none;text-align:left;font-size:clamp(17px,4.3vw,22px);color:var(--bone);
  text-shadow:2px 2px 0 #120804;padding:5px 6px;min-height:40px}
#choices button::before{content:"◆ ";color:var(--edge)}
#choices button:hover,#choices button:focus-visible{color:#ffd25a;outline:none}
#choices button:hover::before,#choices button:focus-visible::before{color:#ffd25a}
body.talk #hud,body.talk #hudR,body.talk #log,body.talk #bottom{display:none}
#bInv.bagbtn{display:inline-flex;align-items:center;gap:6px;padding:0 12px 0 8px}#bInv.bagbtn svg{width:30px;height:30px}
#panel.bag{background:radial-gradient(ellipse at 30% 0%,#7a4e2a 0%,#5a361a 45%,#3e2410 100%);border:3px solid #2a1608;border-radius:18px 18px 10px 10px;box-shadow:inset 0 0 0 7px rgba(0,0,0,.12),inset 0 0 0 9px rgba(240,200,140,.28),0 14px 40px rgba(0,0,0,.65);padding:16px 18px 14px}
#panel.bag::before{content:"";position:absolute;inset:9px;border:2px dashed rgba(240,205,150,.35);border-radius:12px 12px 6px 6px;pointer-events:none}
.baghead{display:flex;align-items:center;gap:12px;margin:-2px 0 4px}.baghead svg{width:64px;height:64px;flex:none;filter:drop-shadow(2px 3px 0 rgba(0,0,0,.4))}
.baghead .title{font-size:26px;padding-right:0}.baghead .sub2{color:#e8d0a8;font-size:13px}
.bag .tabs button{border-radius:8px 8px 0 0;background:#4a2c14;border-color:#2a1608;box-shadow:inset 0 0 0 1px rgba(240,200,140,.25)}.bag .tabs button.on{background:#7a4e26;color:#ffe2a0;border-color:#d8b050}
.baggrid{display:grid;grid-template-columns:230px 1fr;gap:16px;margin-top:6px}@media (max-width:700px){.baggrid{grid-template-columns:1fr}}
.paper{background:rgba(20,10,4,.35);border-radius:10px;padding:10px;box-shadow:inset 0 2px 8px rgba(0,0,0,.45)}
.paper h4,.pockets h4{margin:0 0 8px;color:#f2c870;font-weight:500;font-size:15px}
.doll{position:relative;height:200px}.doll svg.sil{position:absolute;left:50%;top:6px;transform:translateX(-50%);height:188px;opacity:.5}.doll img.sil{position:absolute;left:50%;top:0;transform:translateX(-50%);height:198px;max-width:none;filter:drop-shadow(0 6px 6px rgba(0,0,0,.55))}

function hash(x,y){let n=(x*374761393+y*668265263)|0;n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967295;}
function vnoise(x,y,sd){const xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi,sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
  const a=hash(xi+sd,yi),b=hash(xi+1+sd,yi),c=hash(xi+sd,yi+1),d=hash(xi+1+sd,yi+1);return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy;}
function grid(w,h,f,b){
  const g=[];for(let y=0;y<h;y++){const r=[];for(let x=0;x<w;x++)r.push((x===0||y===0||x===w-1||y===h-1)?b:f);g.push(r);}
  const A={g,w,h,
    set(x,y,c){if(x>=0&&y>=0&&x<w&&y<h)g[y][x]=c;},
    get(x,y){return(x<0||y<0||x>=w||y>=h)?null:g[y][x];},
    rect(x0,y0,x1,y1,c){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)A.set(x,y,c);},
    ell(cx,cy,rx,ry,c){for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const dx=(x-cx)/rx,dy=(y-cy)/ry;if(dx*dx+dy*dy<1)A.set(x,y,c);}},
    hut(x0,y0){A.rect(x0,y0,x0+2,y0+2,'w');A.set(x0+1,y0+1,'f');A.set(x0+1,y0+2,'f');},
    scatter(on,c,th,seed){for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++)if(g[y][x]===on&&hash(x+seed*31,y+seed*17)>th)g[y][x]=c;},
    list(p,c){p.forEach(([x,y])=>A.set(x,y,c));},
    clear(p,c,bad){p.forEach(([x,y])=>{if(bad.includes(A.get(x,y)))A.set(x,y,c);});}};
  return A;
}

function buildGrotte(){const m=grid(27,21,'#','#'),cv=(cx,cy,r)=>{for(let y=cy-r;y<=cy+r;y++)for(let x=cx-r;x<=cx+r;x++)if((x-cx)**2+(y-cy)**2<=r*r+1&&x>0&&y>0&&x<26&&y<20)m.set(x,y,'r');};
  const tun=(a,b)=>{let[x,y]=a;while(x!==b[0]){cv(x,y,1);x+=Math.sign(b[0]-x);}while(y!==b[1]){cv(x,y,1);y+=Math.sign(b[1]-y);}};
  const R={A:[13,16,3],B:[6,12,3],C:[20,12,3],D:[13,6,4],E:[4,4,2],F:[23,4,2]};Object.values(R).forEach(r=>cv(...r));

const TEX={};
function genTextures(){
  ['slate','sand','wood','ash','snow','void'].forEach((k,i)=>TEX[k]=[0,1,2,3].map(v=>floorTex(k,v*97+i*13+3)));
  ['grass','earth','eg','cobble','rock','rs','mud','dune','ice','cavef'].forEach((k,i)=>TEX[k]=[0,1,2,3,4,5].map(v=>vecTex(k,v*53+i*7+1)));

const MATS={

/* Rev 58: Mauerwerk im Pixel-Stil. Jede Seite bekommt einen eigenen Steinverband (unterschiedlich hohe Lagen,
   unterschiedlich breite Steine). Jeder Stein ist einzeln schattiert: Licht von oben links (helle Ober- und Linkskante),
   Schatten unten rechts, abgerundete Ecken, dunkle Fugen, Körnung, Risse, Moos und Wasserspuren.
   Alles wird in Einheiten (RES Pixel) entschieden – dadurch entsteht der grobe, scharfe Pixel-Look. */
function stoneLayout(M,face,seed,HL,FW){const R=rng(seed*97+face*131+HL*7),pick=a=>a[Math.floor(R()*a.length)],rows=[];let v=0,ri=0;
  while(v<HL+2){const h=pick(M.rows);const st=[];let u=M.bond?-((ri%2)*M.cols[0]/2):-Math.floor(R()*6);
    while(u<FW+1){const w=pick(M.cols);st.push({u0:u,u1:u+w,r1:R(),r2:R(),r3:R()});u+=w;}rows.push({v0:v,v1:v+h,st});v+=h;ri++;}
  return rows;}
function stonePx(M,lay,uu,vv,HL,face,seed,o){
  let row=lay[lay.length-1];for(const r of lay)if(vv<r.v1){row=r;break;}
  let s=row.st[row.st.length-1];for(const q of row.st)if(uu<q.u1){s=q;break;}
  const rv=vv-row.v0,rh=row.v1-row.v0,su=uu-s.u0,sw=s.u1-s.u0,mortar=hex(M.mortar),base=hex(M.brick);
  let c,f=0;
  if(rv===0||su===0)c=shC(mortar,(hash(uu+seed,vv)-.5)*.2);
  else if((rv===1||rv===rh-1)&&(su===1||su===sw-1))c=shC(shC(base,(s.r1-.5)*M.var*1.6),-.42);/* abgerundete Ecke */
  else{c=shC(base,(s.r1-.5)*M.var*1.6);if(s.r2>.84)c=shC(hex(M.top),(s.r1-.5)*.25-.08);
    if(rv===1)f+=.26;else if(rv===rh-1)f-=.3;if(su===1)f+=.12;else if(su===sw-1)f-=.2;if(rv===2&&su>1&&su<sw-1)f+=.07;
    const n=hash(uu*7+seed+face*31,vv*13+seed);if(n>.88)f+=.13;else if(n<.1)f-=.15;else if(((uu+vv)&1)&&n>.62)f+=.05;
    if(s.r3<.09&&rh>3&&Math.abs((su-1)-Math.round((rv-1)*(sw-2)/(rh-2)))<1&&rv>1&&rv<rh-1)f-=.45;/* Riss */
    c=shC(c,f);}
  /* Moos und Wasserspuren */
  const mz=M.moss||0,depth=vv/HL;
  if(mz&&hash(uu*3+seed*7,vv*5+face)<mz*Math.pow(depth,3)*(rv===0||su===0?1.1:.55))c=shC(hex(hash(uu,vv*3)>.5?'#3e5628':'#2e4220'),(hash(uu*5,vv)-.5)*.25);
  const dr=hash(uu*11+face*50,seed*3);if(dr>.9&&vv<(dr-.9)*10*HL&&!o.ruin)c=shC(c,-.12);
  if(!o.ruin&&vv<2)c=shC(c,-.2);/* Schatten unter der Abdeckung */
  if(vv>HL-3)c=shC(c,-.12*(vv-(HL-3)));/* Bodenschatten */
  return c;}
function blockSprite(mat,hw,hh,Hh,o={}){
  const M=MATS[mat],PAD=(o.pillar?7:2)*RES,w=hw*2,h=PAD+Hh+hh*2+1,b=buf(w,h),k=hh/hw,seed=o.seed||1;
  const brick=hex(M.brick),mortar=hex(M.mortar),top=hex(M.top),frame=hex(M.frame),cracks=new Set(),rh=M.rh*RES,bl=M.bl*RES,HL=Math.round(Hh/RES);
  if(M.crack){const R=rng(seed+5);for(let c=0;c<3;c++){let ax=Math.floor(R()*w),hp=Math.floor(R()*Hh*.5);
    for(let i=0;i<Hh;i++){cracks.add(ax+','+hp);hp++;if(R()<.5)ax+=R()<.5?-1:1;if(ax<0||ax>=w)break;}}}
  const FW=Math.ceil(hw/RES),LAY=M.rock?null:[stoneLayout(M,0,seed,HL,FW),stoneLayout(M,1,seed,HL,FW)];
  const CW=FW*(HL+3),UC=new Array(2*CW),CRK=M.crack?hex(M.crack):null;
  const DH=Math.min(HL-6,30),WD0=Math.round(HL*.24),WD1=Math.min(HL-10,WD0+Math.max(10,Math.round(HL*.32)));
  const slx=[],crk=[];if(M.rock)for(let x=0;x<w;x++){slx[x]=Hh>=80*RES?Hh*.24+(vnoise(x/(4*RES),2,seed+3)-.5)*16*RES:-1;crk[x]=hash(Math.floor(x/(2*RES))+seed,9)>.82;}
  for(let x=0;x<w;x++){
    const L=x<hw,ax=L?x:x-hw,topY=L?hh+(x+.5)*k:2*hh-(x+.5-hw)*k,jag=o.ruin?Math.floor(hash(Math.floor(x/RES)+seed,7)*6)*RES:0,aL=Math.floor(ax/RES);
    for(let y=Math.ceil(PAD+topY);y<PAD+topY+Hh;y++){
      const hp=Math.floor(y-PAD-topY),hL=Math.floor(hp/RES);if(hp<jag)continue;let c=null;
      if(M.rock){const nv=vnoise(x/(5*RES),y/(8*RES),seed),cr=crk[x]&&((hp/(3*RES))|0)%5<3;
        let cc=shC(brick,(nv-.5)*.6+Math.sin((hp+nv*24*RES)/(4.5*RES))*.06+(cr?-.3:0));
        const sl=slx[x];
        if(hp<sl)cc=shC(hex('#dde1ea'),(nv-.5)*.18-(hp>sl-3*RES?.15:0));
        else if(hp>Hh-14*RES&&nv>.55)cc=shC(hex('#3e4c2a'),(nv-.5)*.4);
        put(b,x,y,shC(cc,(L?0:-.32)-(hp/Hh)*.22));continue;}
      const ck=(L?0:CW)+hL*FW+aL,cv0=UC[ck];if(cv0){put(b,x,y,CRK&&cracks.has(x+','+hp)?CRK:cv0);continue;}
      if(o.door&&L&&aL>=2&&aL<=13&&hL>=HL-DH-1){const d0=HL-DH,ins=(u,v)=>{if(u<4||u>11||v<d0)return false;if(v>=d0+4)return true;const dx=(u-7.5)/4.2,dy=(d0+4-v)/4.2;return dx*dx+dy*dy<=1;};
        if(ins(aL,hL)){const pl=Math.floor((aL-4)/2),pc=hex(['#6a4426','#5e3c20','#704828','#62401f'][pl%4]);
          c=shC(pc,(hash(aL,hL*3)-.5)*.14);if((aL-4)%2===0)c=shC(c,-.3);
          if(hL===d0+6||hL===HL-6){c=hex('#34343a');if(aL%2===1)c=hex('#8a8a94');}
          if((aL===10&&(hL===Math.round((d0+HL)/2)||hL===Math.round((d0+HL)/2)+1))||(aL===9&&hL===Math.round((d0+HL)/2)+1))c=hex('#c8a040');
          if(aL===4||!ins(aL,hL-1))c=shC(c,-.5);if(aL===5)c=shC(c,-.2);/* Tiefe: Schatten der Laibung */
          if(hL===HL-1)c=shC(hex(M.frame),-.1);}
        else if(ins(aL-1,hL)||ins(aL+1,hL)||ins(aL,hL+1)||ins(aL-1,hL+1)||ins(aL+1,hL+1)||(hL>=d0&&(aL===3||aL===12))){
          c=shC(hex(M.frame),(hash(aL*3,Math.floor(hL/2))-.5)*.16+((aL+hL)%3===0?-.28:0)+(aL===3?.12:0)+(aL===12?-.2:0));}}
      else if(o.win===(L?'L':'R')&&aL>=4&&aL<=12){const y0=WD0,y1=WD1,ins=(u,v)=>{if(u<6||u>10||v>y1-1||v<y0)return false;if(v>=y0+3)return true;const dx=(u-8)/2.6,dy=(y0+3-v)/3;return dx*dx+dy*dy<=1;};
        if(ins(aL,hL)){c=hex('#0e1020');if(hL<y0+5&&aL<8)c=hex('#1c2448');
          if(aL===7||aL===9){c=hex('#3a3a44');if(hL%3===0)c=hex('#6a6a78');}if(hL===Math.round((y0+y1)/2))c=hex('#4a4a54');
          if(aL===6||!ins(aL,hL-1))c=shC(c,-.4);}
        else if(hL===y1&&aL>=5&&aL<=11)c=shC(hex(M.frame),aL===5?.2:.1);/* Fensterbank */
        else if(hL===y1+1&&aL>=5&&aL<=11)c=shC(hex(M.mortar),.1);
        else if(ins(aL-1,hL)||ins(aL+1,hL)||ins(aL,hL+1)||ins(aL-1,hL+1)||ins(aL+1,hL+1))c=shC(hex(M.frame),((aL+hL)%2?-.12:.04)+(aL<8?.08:-.12));}
      if(!c)c=shC(stonePx(M,LAY[L?0:1],aL,hL,HL,L?0:1,seed,o),L?0:-.3);
      else c=shC(c,L?0:-.25);
      UC[ck]=c;put(b,x,y,CRK&&cracks.has(x+','+hp)?CRK:c);
    }
  }
  if(!o.ruin){const cy=PAD+hh;for(let y=Math.max(0,Math.floor(cy-hh-1));y<Math.min(h,Math.ceil(cy+hh+1));y++)for(let x=0;x<w;x++){const dd=Math.abs(x+.5-hw)/hw+Math.abs(y+.5-cy)/hh;
    if(dd<=1){let c;if(M.rock)c=Hh>=80*RES?shC(hex('#e4e8f0'),(vnoise(x/(4*RES),y/(4*RES),seed)-.5)*.2):shC(top,(vnoise(x/(4*RES),y/(4*RES),seed)-.5)*.45);
      else{const ux=Math.floor(x/RES),uy=Math.floor(y/RES),n=hash(ux*5+seed,uy*7);c=shC(top,(n-.5)*.16+(n>.9?.1:0));
        if(hash(ux+seed*3,uy*11)>.97)c=shC(top,-.22);}
      if(dd>.86)c=shC(c,y+.5<cy?(x<hw?.3:.12):(x<hw?-.08:-.36));put(b,x,y,c);}}}
  if(o.pillar){const pc=hex(M.pillar),x0=hw-4*RES,x1=hw+4*RES;
    for(let x=x0;x<x1;x++){const L=x<hw,topY=L?hh+(x+.5)*k:2*hh-(x+.5-hw)*k,y0=Math.round(PAD+topY-6*RES),y1=Math.round(PAD+topY+Hh);

        if(x===x0)c=shC(c,.25);if(x===x1-1)c=shC(c,-.4);if(!L)c=shC(c,-.18);if(y>y1-3*RES)c=shC(c,-.2);put(b,x,y,c);}}}

}

/* --- Pixel-Maler mit automatischer Schattierung und Umriss --- */
function makeSprite(w,h,paint,opt={}){
  const b=buf(w,h),glows=[],s=opt.s||1,C=c=>typeof c==='string'?hex(c):c;
  const P={
    px(x,y,c){const cc=C(c),n=Math.max(1,Math.round(s));for(let i=0;i<n;i++)for(let j=0;j<n;j++)put(b,Math.round(x*s)+i,Math.round(y*s)+j,cc);},
    rect(x,y,ww,hh,c){c=C(c);const x0=Math.round(x*s),y0=Math.round(y*s),x1=Math.round((x+ww)*s),y1=Math.round((y+hh)*s);
      for(let yy=y0;yy<y1;yy++)for(let xx=x0;xx<x1;xx++)put(b,xx,yy,c);},
    ell(cx,cy,rx,ry,c){c=C(c);cx*=s;cy*=s;rx*=s;ry*=s;for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){
      const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)put(b,x,y,c);}},
    line(x0,y0,x1,y1,c,t=1){c=C(c);x0*=s;y0*=s;x1*=s;y1*=s;const tt=Math.max(1,Math.round(t*s)),n=Math.ceil(Math.max(Math.abs(x1-x0),Math.abs(y1-y0)))*2+1;
      for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n,y=y0+(y1-y0)*i/n;for(let a=0;a<tt;a++)for(let d=0;d<tt;d++)put(b,Math.floor(x-(tt-1)/2)+a,Math.floor(y-(tt-1)/2)+d,c);}},
    trap(y0,y1,l0,r0,l1,r1,c){c=C(c);const Y0=Math.round(y0*s),Y1=Math.round(y1*s);for(let y=Y0;y<=Y1;y++){const k=Y1===Y0?0:(y-Y0)/(Y1-Y0),
      l=Math.round((l0+(l1-l0)*k)*s),r=Math.round((r0+(r1-r0)*k)*s);for(let x=l;x<=r;x++)put(b,x,y,c);}},
    poly(pts,c){c=C(c);const q=pts.map(([x,y])=>[x*s,y*s]),xs=q.map(p=>p[0]),ys=q.map(p=>p[1]);
      for(let y=Math.floor(Math.min(...ys));y<=Math.ceil(Math.max(...ys));y++)for(let x=Math.floor(Math.min(...xs));x<=Math.ceil(Math.max(...xs));x++){
        let ins=false;for(let i=0,j=q.length-1;i<q.length;j=i++){const[xi,yi]=q[i],[xj,yj]=q[j];
          if(((yi>y+.5)!==(yj>y+.5))&&(x+.5<(xj-xi)*(y+.5-yi)/(yj-yi)+xi))ins=!ins;}if(ins)put(b,x,y,c);}},
    glow(x,y,c){const n=Math.max(1,Math.round(s));for(let i=0;i<n;i++)for(let j=0;j<n;j++)glows.push([Math.round(x*s)+i,Math.round(y*s)+j,C(c)]);}
  };
  paint(P);
  const A=new Uint8Array(w*h);for(let i=0;i<w*h;i++)A[i]=b.d[i*4+3]>0?1:0;
  const op=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&A[y*w+x]===1,R=rng(opt.seed||7);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(!op(x,y))continue;let f=0;
    if(!op(x-1,y)||!op(x,y-1))f+=.2;else if(!op(x-2,y)||!op(x,y-2))f+=.08;
    if(!op(x+1,y)||!op(x,y+1))f-=.24;else if(!op(x+2,y)||!op(x,y+2))f-=.1;
    f+=(w/2-x)/w*.3+(R()-.5)*.06;
    const i=(y*w+x)*4,c=shC([b.d[i],b.d[i+1],b.d[i+2]],f);b.d[i]=c[0];b.d[i+1]=c[1];b.d[i+2]=c[2];}
  const oc=hex(opt.outline||'#120a06');
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(!op(x,y)&&(op(x-1,y)||op(x+1,y)||op(x,y-1)||op(x,y+1)))put(b,x,y,oc);
  glows.forEach(([x,y,c])=>put(b,x,y,c));
  return toCanvas(b);
}

function bfs(sx,sy,goal,pass,maxN=2500){
  const key=(x,y)=>y*W+x,prev=new Map([[key(sx,sy),-1]]),q=[[sx,sy]];let qi=0;

}

function tap(sx,sy){

  let hit=null,best=-1;
  [...ens().filter(e=>!e.dead).map(e=>({o:e,t:'enemy',s:CH[e.k].s||1})),...npcs().map(n=>({o:n,t:'npc',s:1}))].forEach(c=>{
    const q=iso(c.o.rx,c.o.ry);q.y-=elev(c.o.rx,c.o.ry);
    if(Math.abs(wx-q.x)<8*RES*c.s&&wy<q.y+3*RES&&wy>q.y-30*RES*c.s&&c.o.rx+c.o.ry>best){hit=c;best=c.o.rx+c.o.ry;}});

  {let best=null,bd=1e9;for(let k=-2;k<=14;k++)for(const[ax,ay]of[[0,0],[1,0],[0,1]]){const cx=tx+k+ax,cy=ty+k+ay;if(!map[cy]||map[cy][cx]===undefined)continue;
    const mc=map[cy][cx],e=mc==='M'||mc==='V'||mc==='q'?elev(cx,cy):0;if(k!==0&&e===0)continue;if(k<0&&e>0)continue;const q=iso(cx,cy),dd=Math.abs(wx-q.x)/(TW/2)+Math.abs(wy-(q.y-e))/(TH/2)+(e<0?.35:0);if(dd<1.35&&dd<bd&&(e>=0||dd-.35<1)){bd=dd;best=[cx,cy];}}
    if(best){tx=best[0];ty=best[1];}}
  if(!hit){const e=enemyAt(tx,ty),n=npcAt(tx,ty);if(e)hit={o:e,t:'enemy'};else if(n)hit={o:n,t:'npc'};}
  if(G.cast){
    if(hit&&hit.t==='enemy'){const sp=SPELLS[G.cast];
      if(cheb(p.x,p.y,hit.o.x,hit.o.y)>sp.range)log('Zu weit entfernt.');else{G.path=[];G.pending=null;castSpell(G.cast,hit.o);return;}}
    else log('Der Zauber verfliegt ungenutzt.');
    G.cast=null;updateHUD();return;
  }
  if(!hit){const oi=obstAt(tx,ty);if(oi>=0){if(cheb(p.x,p.y,tx,ty)<=1)useObst(oi);else goTo({x:tx,y:ty},{type:'obst',i:oi,x:tx,y:ty});return;}
    if(T(tx,ty)==='K'){if(cheb(p.x,p.y,tx,ty)<=1)mineCrystal(tx,ty);else goTo({x:tx,y:ty},{type:'mine',x:tx,y:ty});return;}}
  if(!hit){const ci=chestAt(tx,ty);if(ci>=0){if(cheb(p.x,p.y,tx,ty)<=1)openChest(ci);else goTo({x:tx,y:ty},{type:'chest',i:ci,x:tx,y:ty});return;}
    const di=digAt(tx,ty);if(di>=0){if(cheb(p.x,p.y,tx,ty)<=1)digHere(di);else goTo({x:tx,y:ty},{type:'dig',i:di,x:tx,y:ty});return;}}
  if(!hit){const bi=bookAt(tx,ty);if(bi>=0){if(cheb(p.x,p.y,tx,ty)<=1)readBook(bi);else goTo({x:tx,y:ty},{type:'read',i:bi,x:tx,y:ty});return;}}
  if(!hit&&T(tx,ty)==='~'&&has('rod')){if(cheb(p.x,p.y,tx,ty)<=3){startFish(tx,ty);return;}log('Zu weit zum Auswerfen – geh näher ans Wasser.');return;}
  G.sel={x:tx,y:ty};G.selT=performance.now();
  if(hit&&hit.t==='enemy'){const e=hit.o;G.sel={x:e.x,y:e.y};if(G.target!==e.id){G.target=e.id;log(`Ziel markiert: ${KINDS[e.k].name} (${e.hp}/${e.maxHp} Leben).`);}
    if(cheb(p.x,p.y,e.x,e.y)<=wRange()){G.path=[];G.pending=null;attack(e);}
    else{const np=pathAdj(e);if(!np){log('Du kommst nicht heran.');return;}G.path=np;G.pending={type:'attack',id:e.id};G.last=0;}
    return;}

  a:()=>{if(!F()[flag]){F()[flag]=1;log('Neue Aufgabe: '+txt.title+'.','q');}if(F()[flag]===1&&bossDead(boss)){F()[flag]=2;S.gold+=gold;const o=rollEq(tier);o.q=3;if(!o.af)o.af=pickAf();giveEq(o);sfx('coin');log(`Aufgabe erfüllt: +${gold} Gold und ${eqName(o)}.`,'q');}},
  o:[{l:'Zurück.',go:'start'},{l:'Leb wohl.'}]};}
const DLG={
  gerold:{start:{t:'Willkommen in Sonnwacht, Fremder. Solange du innerhalb unserer Mauern bist, rührt dich kein Ungeheuer an. Draußen bist du auf dich allein gestellt.',

    lore:{t:'Die letzte Stadt in Vharos, in der noch Licht brennt. Nach dem Riss haben wir die Mauern doppelt so hoch gebaut. Die See spült seit Wochen Fremde an den Strand bei Grauufer – du bist einer der wenigen, die dabei überlebt haben.',o:[{l:'Zurück.',go:'start'},{l:'Leb wohl.'}]},
    way:{t:'Südlich durch das Tor und dann die Straße entlang liegt Grauufer, ein Fischerdorf an der Küste. Dort suchen sie jemanden wie dich. Folge dem goldenen Pfeil auf deinem Kompass, er weist dir den Weg.',o:[{l:'Zurück.',go:'start'},{l:'Leb wohl.'}]}},
  lene:{start:{t:'Lene. Was du draußen brauchst, habe ich hier. Fast alles jedenfalls.',o:[{l:'Zeig mir deine Waren.',shop:'lene'},{l:'Leb wohl.'}]}},
  odo:{start:{t:()=>S.p.hp<S.p.maxHp||S.p.mp<S.p.maxMp?'Odo, Heiler von Sonnwacht. Du siehst mitgenommen aus. Für zehn Münzen mache ich dich wieder heil.':'Odo, Heiler von Sonnwacht. Du bist bei Kräften, gut so. Komm wieder, wenn dich die Wildnis gebissen hat.',
      o:[{l:'Heile mich (10 Gold)',c:()=>S.gold>=10&&(S.p.hp<S.p.maxHp||S.p.mp<S.p.maxMp),a:()=>{S.gold-=10;S.p.hp=S.p.maxHp;S.p.mp=S.p.maxMp;sfx('heal');log('Odo heilt deine Wunden. Leben und Mana sind voll.','q');updateHUD();}},{l:'Leb wohl.'}]}},
  wache1:{start:{t:'Halt die Augen offen da draußen. Nachts kriechen die Toten bis an die Mauern.',o:[{l:'Leb wohl.'}]}},
  wache2:{start:{t:'Das Tor bleibt offen, solange es hell ist. Und meistens auch danach.',o:[{l:'Leb wohl.'}]}},
  yasmin:{start:{t:'Willkommen in Sandhafen, Fremder. Hier handeln wir mit allem, was die Ödnis nicht verschluckt.',o:[{l:'Zeig mir deine Waren.',shop:'yasmin'},{l:'Gibt es Ärger in Sandhafen?',go:'job'},{l:'Leb wohl.'}]},
    job:bossQuest('q_bone','bk1',{title:'Der Knochenkönig',ask:'Im Osten liegt der Versunkene Tempel. Seit der Riss aufging, marschieren nachts Skelette bis an unsere Mauern. Ihr König sitzt auf einem Thron aus Knochen. Zerschlag ihn, und Sandhafen belohnt dich reich.',
      wait:'Der Knochenkönig herrscht noch im Tempel im Osten.',win:'Der Knochenkönig ist zerschlagen? Dann nimm, was wir dir versprochen haben.',done:'Die Nächte sind ruhig. Sandhafen steht in deiner Schuld.'},80,2)},
  gerwin:{start:{t:'Gerwin. Ich halte das Feuer von Ostwacht am Brennen. Seit dreißig Jahren, jede Nacht.',o:[{l:'Für wen brennt das Feuer?',go:'lore'},{l:'Brauchst du Hilfe?',go:'job'},{l:'Leb wohl.'}]},
    lore:{t:'Für die Schiffe nach Tharos, jenseits des Meeres im Osten. Früher kamen sie zurück, beladen mit Steinen, die von selbst leuchteten. Seit die Titanen schweigen, kehrt keines mehr heim. Ich lasse das Feuer trotzdem brennen.',o:[{l:'Zurück.',go:'start'},{l:'Leb wohl.'}]},
    job:{t:()=>{const q=F().q_strand,n=banditProg();if(q===2)return'Seit die Räuber fort sind, kann Ilka wieder in Ruhe handeln. Das Feuer dankt es dir.';
        if(q&&n>=5)return'Fünf Räuber weniger? Dann ist die Küste wieder sicherer. Hier, dein Lohn.';
        return q?`Noch ${5-n} Banditen. Sie lauern entlang der Küste und in den Schluchten.`:'Strandräuber löschen nachts mein Feuer, damit Schiffe an den Klippen zerschellen. Erschlag fünf Banditen, und ich zahle dir achtzig Münzen und zwei große Heiltränke.';},
      a:()=>{if(!F().q_strand){F().q_strand=1;F().q_strand_s=S.banditKills||0;log('Neue Aufgabe: Strandräuber.','q');}

      o:[{l:'Zurück.',go:'start'},{l:'Leb wohl.'}]}},
  ilka:{start:{t:'Ilka. Was das Meer anspült und die Händler bringen, verkaufe ich weiter. Meistens ist es das Meer.',o:[{l:'Zeig mir deine Waren.',shop:'ilka'},{l:'Leb wohl.'}]}},
  gunda:{start:{t:'Gunda, Vorarbeiterin von Erzhall. Wir graben Eisen aus dem roten Stein, solange er uns lässt.',o:[{l:'Was ist mit dem Stollen?',go:'lore'},{l:'Gibt es Arbeit?',go:'job'},{l:'Leb wohl.'}]},
    lore:{t:'Seit dem Riss kriechen Sandskorpione aus den Schluchten in die Gänge. Zwei meiner Leute liegen mit Gift im Blut. Ohne Erz kein Eisen, ohne Eisen keine Klingen gegen die Toten.',o:[{l:'Zurück.',go:'start'},{l:'Leb wohl.'}]},

      o:[{l:'Zurück.',go:'start'},{l:'Leb wohl.'}]}},
  brakk:{start:{t:'Brakk. Ich schmiede, was der Stollen hergibt. Gute Arbeit hat ihren Preis.',o:[{l:'Zeig mir deine Waren.',shop:'brakk'},{l:'Kennst du andere Schmiede?',go:'lore'},{l:'Leb wohl.'}]},
    lore:{t:'Hagen, unten im Glutschlund. Er hat mir das Handwerk beigebracht, bevor ich hierher kam. Sag ihm, Brakk lässt grüßen. Und dass mein Runenpanzer billiger ist.',o:[{l:'Zurück.',go:'start'},{l:'Leb wohl.'}]}},
  maren:{start:{t:'Maren. Ich fische, solange die Seen noch Fische hergeben. In letzter Zeit ziehe ich öfter etwas anderes aus dem Wasser.',o:[{l:'Was ziehst du aus dem Wasser?',go:'lore'},{l:'Kann ich helfen?',go:'job'},{l:'Leb wohl.'}]},
    lore:{t:'Hände. Manchmal ganze Arme. Die Ertrunkenen der Glimmerseen liegen nicht mehr still, seit der Riss aufging. Nachts waten sie ans Ufer und starren auf unsere Hütten.',o:[{l:'Zurück.',go:'start'},{l:'Leb wohl.'}]},

      o:[{l:'Zurück.',go:'start'},{l:'Leb wohl.'}]}},
  ole:{start:{t:'Ole. Früher habe ich Boote gebaut. Heute verkaufe ich, was die Reisenden brauchen. Viele kommen nicht mehr.',o:[{l:'Zeig mir deine Waren.',shop:'ole'},{l:'Baust du noch Boote?',go:'lore'},{l:'Leb wohl.'}]},
    lore:{t:'Mit einem richtigen Boot käme man über alle Seen bis hinunter zur Küste. Aber ohne Holz aus dem Brachfeld und ohne Mut ist das nur ein Traum. Vielleicht eines Tages.',o:[{l:'Zurück.',go:'start'},{l:'Leb wohl.'}]}},
  aldo:{start:{t:'Bruder Aldo, Abt von Steinwacht. Wir hüten hier, was vom Gedächtnis der Welt übrig ist. Nicht viel, fürchte ich.',o:[{l:'Was ist der Titanenrücken?',go:'lore'},{l:'Was wisst ihr vom Pakt?',go:'pakt'},{l:'Braucht ihr Hilfe?',go:'job'},{l:'Leb wohl.'}]},
    lore:{t:'Die Bauern unten sagen, hier schläft ein Riese aus Stein. Sie irren nur halb. Dieser Rücken ist der Leib eines Titanen, erstarrt, als die Titanen verstummten. Manchmal, in stillen Nächten, hört man ihn atmen.',o:[{l:'Zurück.',go:'start'},{l:'Leb wohl.'}]},
    pakt:{t:'Unsere ältesten Schriften sprechen von einem Pakt zwischen Titanen und Menschen. Geschlossen wurde er nicht hier, sondern tief im Osten, unter den ältesten Bäumen. Dort, wo heute der Nebelwald steht.',o:[{l:'Zurück.',go:'start'},{l:'Leb wohl.'}]},

      a:()=>{if(!F().q_harpy){F().q_harpy=1;F().q_harpy_s=S.harpyKills||0;log('Neue Aufgabe: Harpyien über Steinwacht.','q');}

      o:[{l:'Zurück.',go:'start'},{l:'Leb wohl.'}]}},
  wenna:{start:{t:()=>S.p.hp<S.p.maxHp||S.p.mp<S.p.maxMp?'Schwester Wenna. Du blutest ja. Für zwölf Münzen verbinde ich dich.':'Schwester Wenna. Ich pflege die Kranken und verkaufe, was der Garten hergibt.',

  hanne:{start:{t:'Hanne. Ich halte Kornwacht zusammen, so gut es geht. Die Felder liegen brach, seit die Toten umgehen.',o:[{l:'Was ist mit den Feldern?',go:'lore'},{l:'Kann ich helfen?',go:'job'},{l:'Leb wohl.'}]},

      o:[{l:'Zurück.',go:'start'},{l:'Leb wohl.'}]}},
  jost:{start:{t:'Jost, Müller ohne Mehl. Die Mühle steht still, also handle ich mit dem, was übrig ist.',o:[{l:'Zeig mir deine Waren.',shop:'jost'},{l:'Warum steht die Mühle still?',go:'lore'},{l:'Leb wohl.'}]},
    lore:{t:'Kein Korn, kein Mehl. Und oben am Titanenrücken heult nachts der Wind durch die Felsen wie eine Stimme. Die Alten sagen, dort schläft ein Riese aus Stein.',o:[{l:'Zurück.',go:'start'},{l:'Leb wohl.'}]}},
  birger:{start:{t:'Birger. Jäger, solange es noch etwas zu jagen gibt. Das Eis frisst die Wälder.',o:[{l:'Was ist mit dem Eis?',go:'job'},{l:'Leb wohl.'}]},
    job:bossQuest('q_ice','ig1',{title:'Das Eis erwacht',ask:'Nördlich von hier, am gefrorenen See, ist ein Eisgolem erwacht. Er zerschmettert alles, was sich bewegt. Zerstör ihn, dann bekommst du meine beste Beute.',

    job:bossQuest('q_spider','sq1',{title:'Die Spinnenkönigin',ask:'Die Spinnen aus der Grotte im Westen haben meinen Bruder geholt. Ihre Königin brütet tief im Berg. Töte sie, bitte.',

  mira:{start:{t:'Mira. Ich sammle, was andere fürchten. Spinnenseide zum Beispiel.',o:[{l:'Wozu brauchst du Seide?',go:'job'},{l:'Leb wohl.'}]},

      o:[{l:'Zurück.',go:'start'},{l:'Leb wohl.'}]}},
  mareth:{
    start:{t:()=>{const c=shardCount(),f=F();
        if(c>=3&&!f.reveal)return'Du bist zurück. Und du trägst drei Splitter. Ich sehe es an deinen Augen – du erinnerst dich. Setz dich, Fremder. Ich schulde dir die Wahrheit.';

        return S.kills<3?'Das Gräberfeld liegt im Nordwesten des Dorfes. Halte dich nachts von den Gräbern fern.':'Es ist still geworden da oben. Hat Oswin dir den Schlüssel gegeben?';},
      o:[{l:'Sag mir die Wahrheit, Mareth.',go:'truth1',c:()=>shardCount()>=3&&!F().reveal},

    help:{t:()=>{const q=F().q_wolves;if(!q)return'Die Wölfe werden dreister, sie reißen unsere Ziegen bis an den Zaun. Erlege fünf von ihnen, dann zahle ich dir dreißig Münzen und einen Heiltrank.';

      o:[{l:'Zurück.',go:'start'},{l:'Leb wohl.'}]},
    truth1:{t:'Du bist kein Fremder. Du warst einer der vier Siegelwächter aus Tharos – der Jüngste. Vor einem Jahr kamst du schon einmal hierher, allein, mit diesem Amulett. Du bist in den Steinkreis gegangen. Danach kam der Riss.',
      o:[{l:'Das kann nicht sein.',go:'truth2'},{l:'Weiter.',go:'truth2'}]},
    truth2:{t:'Unter dem Siegel schläft Nhal, der Hungernde – der fünfte Titan, den die vier anderen einst gebunden haben. Er hat dir versprochen, deine Frau und dein Kind zurückzubringen, die das Fieber geholt hatte. Du hast ihm geglaubt und die Splitter gelöst.',
      o:[{l:'Und du hast es die ganze Zeit gewusst.',go:'truth3'}]},
    truth3:{t:'Ja. Ich habe dich am ersten Tag erkannt, am Amulett. Ich hätte es dir sagen müssen. Aber ich wollte sehen, wer du bist, wenn du nicht weißt, wer du warst. Und du hast uns geholfen. Jeden Tag.',
      o:[{l:'Ich vergebe dir, Mareth.',go:'forgive',a:()=>{F().reveal=1;F().mareth=1;log('Du hast Mareth vergeben.');jAdd('choice','Mareth hat mir die Wahrheit gesagt: Ich war einer der vier Siegelwächter aus Tharos und habe den Riss geöffnet, für Nhals Versprechen. Ich habe ihm vergeben.',{key:'mareth'});}},
        {l:'Du hast mich belogen. Geh mir aus den Augen.',go:'shun',a:()=>{F().reveal=1;F().mareth=-1;log('Du hast Mareth verstoßen.','hurt');jAdd('choice','Mareth hat mir die Wahrheit gesagt: Ich war einer der vier Siegelwächter aus Tharos und habe den Riss geöffnet, für Nhals Versprechen. Er hat es die ganze Zeit gewusst. Ich habe ihn verstoßen.',{key:'mareth'});}}]},
    forgive:{t:'Dann geh mit meinem Segen, Wächter. Hol den letzten Splitter. Und wenn du vor dem Steinkreis stehst und eine warme Stimme dir etwas verspricht – hör nicht hin.',
      o:[{l:'Leb wohl.'}]},
    shun:{t:'Wie du willst. Aber merk dir eins: Nhal wird dich rufen. Und dann wirst du dir wünschen, jemand stünde neben dir.',
      o:[{l:'Leb wohl.'}]},
    where:{t:'Grauufer, ein Fischerdorf am Ende von Vharos. Früher wachten vier Titanen über dieses Land: Erde, Wasser, Feuer und Luft. Heute wacht hier niemand mehr.',
      o:[{l:'Erzähl mir mehr.',go:'start'},{l:'Leb wohl.'}]},
    world:{t:'Die Küstenstraße führt nach Westen zum Tränensee. Weit im Osten, mitten in der Sengenden Ödnis, liegt der Glutschlund, wo die Erde brennt. Im Nordwesten liegt die Alte Feste, dort haust eine Räuberbande. Im Norden führt ein Pass durch die Berge zur Sturmspitze. Dort tobt ein Sturm, nur die Stärksten überstehen ihn. Und an den Straßen stehen alte Wegsteine: Wer sie berührt, kann zwischen ihnen reisen. Nördlich von hier soll eine Höhle tief in einen Berg führen, voller leuchtender Kristalle. Weit im Osten, hinter dem Glutschlund, sollen das Fahlmoor, die Frostmark und die Sengende Ödnis liegen. Und in den Wäldern dazwischen jagen Wölfe und Schlimmeres.',
      o:[{l:'Zurück.',go:'start'},{l:'Leb wohl.'}]},
    quest:{t:'Seit der Riss aufgegangen ist, stehen sie wieder auf. Auf dem Gräberfeld gehen Ghule um. Oswin, unser Totengräber, hat sich in seiner Hütte östlich davon verbarrikadiert. Er hat den Schlüssel zur Gruft.',
      a:()=>{if(!F().quest){F().quest=1;log('Neues Ziel: das Gräberfeld.','q');}},

/* ---------- Rev 81: Angeln ----------
   Mit Angelrute (bei Bram in Grauufer, Yasmin in Sandhafen, oder am Strand von Grauufer) aufs Wasser tippen (max. 3 Felder entfernt).
   Der Schwimmer treibt, nach 2–7 s beißt etwas an: Der Schwimmer taucht unter und ein „!“ erscheint. Jetzt schnell irgendwo tippen!
   Zu früh oder zu spät getippt – der Fisch ist weg. Laufen beendet das Angeln. Fang: essen (heilt) oder bei Händlern verkaufen. */
function fishTable(x,y){const z=zoneAt(x,y);
  if(z==='traenen'||z==='glimmer')return[['fish_barsch',40],['fish_aal',25],['fish_leucht',12],['fish_hering',8],['boot',15]];
  if(z==='frosthain'||z==='nordpass')return[['fish_hering',40],['fish_aal',20],['fish_leucht',8],['fish_makrele',17],['boot',15]];
  return[['fish_hering',38],['fish_makrele',27],['fish_aal',14],['fish_leucht',4],['boot',17]];}
function startFish(x,y){const p=S.p,now=performance.now();G.path=[];G.pending=null;setFace(p,x-p.x,y-p.y);
  G.fish={x,y,t0:now,bite:now+2000+Math.random()*5000,ph:'wait'};sfx('miss');log('Du wirfst die Angel aus. Warte, bis der Schwimmer untertaucht – dann schnell tippen!');}
function reelIn(){const f=G.fish;G.fish=null;if(!f)return;const p=S.p;
  if(f.ph!=='bite'){log('Zu früh eingeholt – nichts am Haken.');return;}
  {if(!DECOK)buildDeco();const nb=DIGS.findIndex(d=>d.i>0&&!(F().tmaps||{})[d.i]);if(nb>=0&&Math.random()<(skL('fish')>=5?.16:.08)){giveMap(nb);sfx('coin');burst(f.x,f.y,['#cfe8ff','#ffffff'],14,1.2);
    log('Eine Flaschenpost! Darin ein zusammengerolltes Pergament – eine Schatzkarte.','q');storyCard('Flaschenpost','<p>In der Flasche steckt ein Stück Pergament, sorgfältig gerollt. Jemand hat eine Küste gezeichnet und ein X gesetzt.</p>'+mapImg(nb));updateHUD();save();playerActed();return;}}
  const FL=skL('fish'),tb=fishTable(f.x,f.y).map(([k,w])=>[k,k==='fish_leucht'?w*(1+(FL>=4?1.5:FL>=2?.6:0)):k==='fish_aal'?w*(1+(FL>=2?.5:0)):k==='boot'?w*Math.max(.3,1-.15*FL):w]),sum=tb.reduce((a,b)=>a+b[1],0);skUse('fish',1);let r=Math.random()*sum,k=tb[0][0];for(const[kk,w]of tb){if((r-=w)<=0){k=kk;break;}}
  give(k);S.fishN=(S.fishN||0)+1;sfx(k==='boot'?'miss':'coin');burst(f.x,f.y,['#cfe8ff','#ffffff','#7ab0e0'],14,1.2);
  floatAt(p.x,p.y,k==='boot'?'Stiefel …':ITEMS[k].n+'!',k==='fish_leucht'?'#9ff4ff':'#e0d2b4');
  log(k==='boot'?'Ein alter Stiefel. Immerhin hat er keine Zähne.':k==='fish_leucht'?'Ein Leuchtfisch! Er glimmt in deiner Hand wie ein Splitter aus Licht.':`Gefangen: ${ITEMS[k].n}.`,'q');
  updateHUD();save();playerActed();}
function fishTick(now){const f=G.fish;if(!f||!S||S.over)return;
  if(f.ph==='wait'&&now>=f.bite){f.ph='bite';f.bt=now;sfx('zap');floatAt(f.x,f.y,'!','#ffd060');}
  else if(f.ph==='bite'&&now-f.bt>1200+260*skL('fish')){G.fish=null;log('Der Fisch hat den Köder abgerissen. Schneller tippen!');}}
function drawFishing(now,t){const f=G.fish;if(!f)return;const p=S.p,pq=iso(p.rx,p.ry);pq.y-=elev(p.rx,p.ry);const q=iso(f.x,f.y);

    lx.fillStyle='#1a1010';lx.fillRect(Math.round(bx-2.5*RES),Math.round(by+dip-4.5*RES),5*RES,5.5*RES);lx.fillStyle='#e0301e';lx.fillRect(Math.round(bx-2*RES),Math.round(by+dip-4*RES),4*RES,2.5*RES);
    lx.fillStyle='#f4f0e6';lx.fillRect(Math.round(bx-2*RES),Math.round(by+dip-1.5*RES),4*RES,2.5*RES);lx.fillStyle='#ffffff';lx.fillRect(Math.round(bx-1.5*RES),Math.round(by+dip-3.5*RES),RES,RES);}}

 {at:'hagen',t:'Gesetz der Glutschmiede',h:`<p>Erstes Gesetz: Das Feuer gehorcht nicht, es wird gebunden. Zweites Gesetz: Wer einen Glutgeist bindet, nährt ihn mit Erz, nicht mit Blut. Drittes Gesetz: Eine Klinge, die einen Titanen schneidet, darf nur einmal geschmiedet werden, denn sie trinkt das Feuer der Schmiede für immer.</p>`},

 {at:'hanne',t:'Kinderreim aus Kornwacht',h:`<p><i>Erde schläft und Wasser fließt,<br>Feuer brennt und Wind, der bläst.<br>Doch wer den Fünften weckt im Berg,<br>dem wird sein liebster Wunsch zur Asche.</i></p>`}];

    for(let r=2;r<=6;r++){let done=false;for(let dy=-r;dy<=r&&!done;dy++)for(let dx=-r;dx<=r&&!done;dx++){if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;const x=ax+dx,y=ay+dy,c=map[y]&&map[y][x];
      if(!c||!WALK.has(c)||c==='M'||c==='Y'||busy.has(y*W+x)||DECO.has(y*W+x))continue;
      if(![[0,1],[1,0],[-1,0],[0,-1]].some(([a,b])=>REACH.has((x+a)+','+(y+b))))continue;
      let door=false;for(let yy=-1;yy<=1;yy++)for(let xx=-1;xx<=1;xx++){const d=map[y+yy]&&map[y+yy][x+xx];if(d==='D'||d==='G'||d==='W'||d==='Y')door=true;}if(door||!canBlock(x,y))continue;

/* ---------- Nhal im Aschenhorn: Begegnung am Kraterrand ---------- */
let NHALCD=0;
function nhalTick(now){if(!S||S.over||uiOpen||F().ending)return;const p=S.p,near=cheb(p.x,p.y,VOLC.x,VOLC.y)<=6;
  if(!near){G.nhalSeen=0;return;}if(shardCount()<4||G.nhalSeen||now<NHALCD)return;G.nhalSeen=1;
  const blade=S.eq.weapon&&S.eq.weapon.k==='titanblade',alive=S.enemies.some(e=>e.k==='nhal'&&!e.dead);if(alive)return;
  const B=[['Die Splitter übergeben',()=>{closeOverlay();ending('c');},false]];
  if(blade)B.push(['Nhal herausfordern',()=>{closeOverlay();spawnNhal();},true]);
  B.push(['Zurückweichen',()=>{closeOverlay();NHALCD=performance.now()+8000;log('Du wendest dich ab. Hinter dir lacht die Glut.');},!blade]);
  overlay(`<h1>Die Aschenstimme</h1><div class="story"><p>Die Lava hebt sich wie ein Atemzug. Aus der Glut formt sich ein Gesicht, das du kennst – das Gesicht deiner Frau.</p>
    <p><i>„Wächter. Du hast sie mir gebracht, alle vier. Gib sie mir, und ich gebe dir zurück, was das Fieber dir genommen hat. Sie warten auf dich.“</i></p>

function spawnNhal(){const spots=[];for(let dy=-5;dy<=5;dy++)for(let dx=-5;dx<=5;dx++){const x=VOLC.x+dx,y=VOLC.y+dy;if(map[y][x]==='M'&&Math.hypot(dx,dy)<5.5&&!(x===S.p.x&&y===S.p.y))spots.push([x,y,cheb(x,y,S.p.x,S.p.y)]);}

  log('Nhal erhebt sich aus der Lava. Der Titanenbrecher glüht in deiner Hand.','hurt');updateHUD();}

/* ---------- Drei Enden ---------- */
function epilogue(){const f=F(),L=[];
  L.push(f.mareth>0?'Mareth wird alt in Grauufer. Er erzählt den Kindern von einem Fremden, der zurückkam, um seinen Fehler zu richten.':f.mareth<0?'Mareth verlässt Grauufer noch im selben Winter. Niemand weiß, wohin.':'');
  L.push(f.fac_erde>0?'Die Stillen hüten weiter die Gräber – und niemand fragt, was in der Gruft geschieht.':f.fac_erde<0?'Die Stillen werden aus Grauufer verbannt. Die Fremden, die die See bringt, werden nun gepflegt statt begraben.':'');
  L.push(f.fac_wasser>0?'An der Küste brennen wieder Leuchtfeuer, für jedes Schiff.':f.fac_wasser<0?'Die Seelotsen zerstreuen sich. Ihre Türme verfallen.':'');
  L.push(f.fac_feuer>0?'Hagens Esse bleibt kalt. Er wird Fischer in Sandhafen und singt nie wieder.':f.fac_feuer<0?'Im Glutschlund tanzen freie Glutgeister über der Lava. Hagen sieht ihnen jede Nacht zu.':'');
  L.push(f.fac_luft>0?'Die Sturmbrüder läuten in Steinwacht jeden Abend die Glocke für dich.':f.fac_luft<0?'In Steinwacht schreibt Bruder Aldo ein neues Buch: über einen Mann, den der Wind nicht lenken konnte.':'');
  const nb=f.books?Object.keys(f.books).length:0;
  return L.filter(Boolean).map(t=>`<p>${t}</p>`).join('')+`<p class="hint">${S.turn} Züge · Stufe ${S.p.lvl} · ${S.gold} Gold · ${nb}/${BOOKS.length} Schriften gelesen</p>`;}
function ending(kind){if(F().ending)return;F().ending=kind;S.over=true;G.path=[];G.pending=null;clearSave();
  const T={a:['Das neue Siegel','<p>Du trittst in die Mitte des Steinkreises. Die vier Splitter lösen sich aus deinen Händen und kreisen über dir. Dann sinken sie in deine Brust, und du wirst still wie Stein.</p><p>Der Riss schließt sich. Unter dem Aschenhorn verstummt das Summen. Du bist das Siegel nun, und du wirst es bleiben.</p>'+(F().mareth>0||F().fac_luft>0?'<p>Du bist nicht allein: '+[F().mareth>0?'Mareth':'',F().fac_luft>0?'die Sturmbrüder':''].filter(Boolean).join(' und ')+' stehen am Rand des Kreises, bis es dunkel wird.</p>':'<p>Niemand steht am Kreis, als die Steine dich aufnehmen.</p>')+'<p>Im Frühjahr kehrt das erste Schiff aus Tharos zurück.</p>'],
    b:['Der Erlöser','<p>Der Titanenbrecher fährt in die Glut, und Nhal schreit mit der Stimme deiner Frau. Dann zerfällt er zu Asche, endgültig.</p><p>Mit ihm sterben die Vier. Die Splitter in deiner Tasche werden zu gewöhnlichen Steinen. Kein Zauber wirkt mehr in Vharos, kein Leuchtstein leuchtet je wieder.</p><p>Die Welt ist frei. Und ein wenig ärmer.</p>'],
    d:['Der freie Wächter','<p>Du legst die Splitter in die vier Mulden des Kreises und sprichst die Siegelworte, die dir die Titanentafeln verraten haben. Die Steine schließen sich um das Licht, nicht um dich.</p><p>Der Riss heilt. Unter dem Aschenhorn verstummt das Summen. Und du gehst aus dem Kreis – ein Wächter, der frei geblieben ist.</p><p>Im Frühjahr kehrt das erste Schiff aus Tharos zurück. Du stehst am Strand, als es anlegt.</p>'],
    c:['Der Hungernde','<p>Du öffnest die Hände. Die Splitter fallen in die Glut, und die Glut nimmt sie dankbar.</p><p>Deine Frau tritt aus der Lava, dein Kind an der Hand. Ihre Gesichter sind aus Asche. Sie lächeln, und das Lächeln bröckelt.</p><p>In Sonnwacht erlischt das letzte Licht von Vharos.</p>']}[kind];
  if(kind!=='c'&&skL('lang')>=5)T[1]+='<p class="hint">Dank deiner Kenntnis der Siegelschrift liest du die letzten Zeilen am Kreis: „Vier hielten den Fünften. Einer schloss den Kreis.“</p>';
  sfx(kind==='c'?'dead':'victory');burst(S.p.x,S.p.y,kind==='c'?['#2a1a12','#ff4020','#000000']:['#e04030','#60b8f0','#ff9020','#e8f2ff'],70,2.2);
  setTimeout(()=>overlay(`<h1>${T[0]}</h1><div class="sub">${kind==='c'?'Ein dunkles Ende':'Ende'}</div><div class="story">${T[1]}<hr style="border:none;border-top:1px solid rgba(200,160,100,.3)">${kind==='c'?'':epilogue()}</div>`,[['Neu beginnen',charCreate,true]]),1200);}

/* ===================== Rev 89: Schatztruhen und Schätze ===================== */
const CHESTS=[],DIGS=[],CHT=new Map(),BCHT=new Map(),MIMT=new Map();
let ZC=null;const zc=(x,y)=>{if(!ZC){ZC=new Array(W*H);for(let yy=0;yy<H;yy++)for(let xx=0;xx<W;xx++)ZC[yy*W+xx]=zoneAt(xx,yy);}return ZC[y*W+x];};
const CHPLAN={wood:{grau:1,sonnwacht:1,kornwacht:1,schilfrode:1,steinwacht:1,erzhall:1,ostwacht:1,sandhafen:1,frosthain:1,mira:1,traenen:1,brach:1},
  locked:{feste:3,tempel:2,nebel:1,eissee:1,titan:1},trap:{grotte:2,kristall:1,glut:1},mimic:{kristall:1,grotte:1}};
const DIGPLAN=[{z:['sandhafen','wueste'],name:'Die Truhe der „Morgenwind“'},{z:['traenen'],name:'Am Ufer des Tränensees'},{z:['schilfrode','moor'],name:'Im Schilf'},{z:['vulkan','klippe','ostwacht'],name:'Unter den Klippen'},{z:['frosthain','frost','eissee'],name:'Im Frost'}];
const chs=()=>{const f=F();return f.chests=f.chests||{};};
function placeChests(busy,canBlock){CHESTS.length=0;DIGS.length=0;CHT.clear();BCHT.clear();MIMT.clear();
  const want=new Set();Object.values(CHPLAN).forEach(o=>Object.keys(o).forEach(z=>want.add(z)));DIGPLAN.forEach(d=>d.z.forEach(z=>want.add(z)));
  const cand={},sand={},bad=c=>!c||!WALK.has(c)||c===','||c==='Y'||c==='M'||c==='S';
  for(let y=2;y<H-2;y++)for(let x=2;x<W-2;x++){const z=zc(x,y);if(!want.has(z))continue;const c=map[y][x];if(bad(c))continue;const i=y*W+x;if(busy.has(i)||DECO.has(i))continue;
    if(![[0,1],[1,0],[-1,0],[0,-1]].some(([a,b])=>REACH.has((x+a)+','+(y+b))))continue;
    let near=false,door=false;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const d=map[y+dy][x+dx];if(d==='D'||d==='G'||d==='W'||d==='Y'||d==='A')door=true;if(!WALK.has(d)&&d!=='~')near=true;}
    if(door)continue;const h=hash(x*31+7,y*17+3);
    if(near)(cand[z]=cand[z]||[]).push([x,y,h]);if(c==='s'||c==='y'||c==='.'||c==='k'||c==='p')(sand[z]=sand[z]||[]).push([x,y,h]);}
  const used=[],far=(x,y)=>used.every(([a,b])=>Math.max(Math.abs(a-x),Math.abs(b-y))>=5);
  const add=(x,y,t,o={})=>{const ci=CHESTS.length;CHESTS.push({x,y,t,...o});used.push([x,y]);const i=y*W+x;DECO.set(i,{k:'tchest',o:t,ci});
    if(t==='boss')BCHT.set(i,o.boss);else{DECOB.add(i);if(t==='mimic')MIMT.set(i,ci);}CHT.set(i,ci);};
  for(const t of['wood','locked','trap','mimic'])for(const[z,n]of Object.entries(CHPLAN[t])){const L=(cand[z]||[]).slice().sort((a,b)=>a[2]-b[2]);let k=0;
    for(const[x,y]of L){if(k>=n)break;if(!far(x,y)||DECO.has(y*W+x)||!canBlock(x,y))continue;add(x,y,t);k++;}}
  /* Bosstruhen neben den Altären (erscheinen erst nach dem Sieg) und die Fallen-Truhe mit Mareths Dolch in der Gruft */
  ALT.forEach(a=>{let done=false;for(let r=1;r<=3&&!done;r++)for(let dy=-r;dy<=r&&!done;dy++)for(let dx=-r;dx<=r&&!done;dx++){const x=a.x+dx,y=a.y+dy,c=map[y]&&map[y][x];
    if(bad(c)||busy.has(y*W+x)||DECO.has(y*W+x)||!REACH.has(x+','+y))continue;add(x,y,'boss',{boss:a.boss,el:a.el});done=true;}});
  {const a=ALT.find(a=>a.el==='erde');if(a){let done=false;for(let r=2;r<=4&&!done;r++)for(let dy=-r;dy<=r&&!done;dy++)for(let dx=-r;dx<=r&&!done;dx++){const x=a.x+dx,y=a.y+dy,c=map[y]&&map[y][x];
    if(bad(c)||busy.has(y*W+x)||DECO.has(y*W+x)||!canBlock(x,y)||![[0,1],[1,0],[-1,0],[0,-1]].some(([p,q])=>REACH.has((x+p)+','+(y+q))))continue;add(x,y,'trap',{u:'wdagger'});done=true;}}}
  /* Grabstellen für Schatzkarten */
  DIGPLAN.forEach((d,di)=>{let L=[];d.z.forEach(z=>L=L.concat(sand[z]||[]));L.sort((a,b)=>a[2]-b[2]);
    const p=L.find(([x,y])=>far(x,y)&&REACH.has(x+','+y));if(p){DIGS.push({x:p[0],y:p[1],name:d.name,i:di});used.push([p[0],p[1]]);}});}

    const cut=map[y][x]==='M'?(d>pd&&d-pd<=7&&Math.abs((x-y)-pc)<=4):(cutAt(x,y)||(TGT&&'TB'.includes(map[y][x])&&d>TGT.x+TGT.y&&d-(TGT.x+TGT.y)<=3&&Math.abs((x-y)-(TGT.x-TGT.y))<=2));
    if(map[y][x]==='~')waterFx(x,y,t);drawObject(x,y,t,cut);drawDeco(x,y,cut,t);const l=ents[x+','+y];if(l)l.forEach(fn=>fn());
    const bl=BLAT.get(x+','+y);if(bl&&!(p.x>=bl.x0&&p.x<=bl.x1&&p.y>=bl.y0&&p.y<=bl.y1)){let cc=false;
      for(let yy=bl.y0;yy<=bl.y1&&!cc;yy++)for(let xx=bl.x0;xx<=bl.x1;xx++)if((xx===bl.x0||xx===bl.x1||yy===bl.y0||yy===bl.y1)&&cutAt(xx,yy)){cc=true;break;}
      if(!cc){const r=roofSprite(bl);lx.drawImage(r.c,r.x,r.y);}}}
  drawFishing(now,t);
  if(cheb(p.x,p.y,VOLC.x,VOLC.y)<=45)volcDrawSky(now,t);
  lx.globalCompositeOperation='lighter';
  for(let i=parts.length-1;i>=0;i--){const a=parts[i];a.x+=a.vx;a.y+=a.vy;a.vy+=.03*RES;a.life-=dt*1.5;
    if(a.life<=0){parts.splice(i,1);continue;}lx.globalAlpha=a.life;lx.fillStyle=a.col;const s=(a.life>.6?2:1)*RES;lx.fillRect(Math.round(a.x),Math.round(a.y),s,s);}
  lx.globalAlpha=1;
  for(let i=G.bolts.length-1;i>=0;i--){const B=G.bolts[i],age=(now-B.t)/260;if(age>=1||age<0){G.bolts.splice(i,1);continue;}
    const A=iso(...B.a),Z2=iso(...B.b);A.y-=elev(...B.a)+18*RES;Z2.y-=elev(...B.b)+14*RES;
    for(const[w,col,al]of[[7*RES,'rgba(120,190,255,',.35],[2.6*RES,'rgba(220,245,255,',1]]){lx.strokeStyle=col+(al*(1-age))+')';lx.lineWidth=w;lx.lineJoin='round';lx.beginPath();lx.moveTo(A.x,A.y);
      const n=9;for(let k=1;k<n;k++){const t=k/n,j=(Math.random()-.5)*16*RES;lx.lineTo(A.x+(Z2.x-A.x)*t+j,A.y+(Z2.y-A.y)*t+j*.6);}lx.lineTo(Z2.x,Z2.y);lx.stroke();}
    lx.fillStyle=`rgba(200,240,255,${.5*(1-age)})`;lx.beginPath();lx.arc(Z2.x,Z2.y,10*RES*(1-age),0,7);lx.fill();}
  lx.globalCompositeOperation='source-over';
  /* Licht: großes Sichtfeld, Nächte dunkel, aber nicht blind */
  lx.setTransform(Z,0,0,Z,0,0);
  const scr=(x,y)=>{const q=iso(x,y);return[q.x+offX,q.y+offY];};
  const[psx,psy0]=scr(p.rx,p.ry),psy=psy0-12*RES-elev(p.rx,p.ry),dl=daylight(),ZN=ZD();
  if(!ZN.cave&&dl<1){lx.fillStyle=`rgba(16,22,56,${.2*(1-dl)})`;lx.fillRect(0,0,LW,LH);}
  let rad=(170+330*dl)*RES,oa=.84-.5*dl;/* Rev 96: Bildrand draußen etwas dunkler (vorher .74 − .5 × Tageslicht) */if(ZN.cave){rad=230*RES;oa=.66;}if(ZN.dark){rad=150*RES;oa=.9;}if(inI){rad=120*RES;oa=.86;}if((ZN.cave||ZN.dark||inI)&&S.inv.includes('lotsenlampe'))rad*=1.6;
  /* Rev 62: Lichtkarte statt einfachem Kreis. Lampen, Leuchter, Feuer, Lava, Altäre und Wegsteine schneiden Licht in die
     Dunkelheit – nachts sind Städte und Innenräume durch ihre Lampen erhellt. Die Karte ist 24-mal kleiner als das Bild. */
  {const nl=(1-dl)*.6+(ZN.cave||ZN.dark||inI?.4:0),L=[];
    glows.forEach(([c,x,y,k])=>{const[sx,sy]=scr(x,y);
      if(c==='D')L.push([sx,sy-24*RES,(k==='lantern'?95:70)*RES,.95]);else if(c==='F')L.push([sx,sy-8*RES,110*RES,.95]);
      else if(c==='L')L.push([sx,sy,40*RES,.5]);else if(c==='A')L.push([sx,sy-8*RES,60*RES,.8]);else if(c==='K')L.push([sx,sy-14*RES,70*RES,.8]);
      else if(c==='W'||c==='R')L.push([sx,sy-16*RES,55*RES,.7]);});
    lightMap(psx,psy,rad,oa,nl>.05?L:[]);}
  lx.globalCompositeOperation='lighter';
  const glow=(x,y,r,col)=>{const gg=lx.createRadialGradient(x,y,0,x,y,r);gg.addColorStop(0,col);gg.addColorStop(1,'rgba(0,0,0,0)');lx.fillStyle=gg;lx.fillRect(x-r,y-r,r*2,r*2);};
  glows.forEach(([c,x,y,k])=>{const[sx,sy]=scr(x,y);
    if(c==='D'){const nf=1-dl*.7;if(k==='lantern')glow(sx,sy-30*RES,60*RES,`rgba(255,190,90,${.2*nf})`);else glow(sx,sy-26*RES,48*RES,`rgba(255,170,70,${.18*nf})`);}
    else if(c==='L')glow(sx,sy,20*RES,'rgba(255,110,40,.16)');
    else if(c==='A'){glow(sx,sy-6*RES,30*RES,'rgba(255,170,80,.16)');const a=ALT[altarAt(x,y)];if(a&&!F()['shard_'+a.el])glow(sx,sy-22*RES,22*RES,'rgba(200,230,255,.22)');}
    else if(c==='F')glow(sx,sy-8*RES,60*RES,'rgba(255,140,50,.22)');
    else if(c==='K')glow(sx,sy-14*RES,46*RES,'rgba(190,140,255,.28)');
    else if(c==='W')glow(sx,sy-20*RES,30*RES,'rgba(127,232,240,.22)');
    else if(c==='R')glow(sx,sy-16*RES,34*RES,`rgba(127,200,192,${.06+.06*shardCount()})`);});
  const fl=RM?1:.9+.1*Math.sin(t*9)*Math.sin(t*5.3);glow(psx,psy,60*RES*fl,'rgba(220,150,70,.12)');
  lx.globalCompositeOperation='source-over';
  moodTint(inI,dt);
  ambient(dl,dt);
  const ha=1-(now-G.hurt)/450;if(ha>0){lx.fillStyle=`rgba(160,30,15,${.25*ha})`;lx.fillRect(0,0,LW,LH);}
  if(G.noGround){G.noGround=false;G.fade=now;}
  const fa=1-(now-G.fade)/700;if(fa>0){lx.fillStyle=`rgba(4,2,1,${fa})`;lx.fillRect(0,0,LW,LH);}
  const K=PXd/dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.textAlign='center';
  const fs=clamp(Math.round(Math.min(cw,ch)/48),13,18);
  const label=(txt,x,y,col,size)=>{ctx.font=`500 ${size||fs}px "Pixelify Sans",monospace`;ctx.fillStyle='#120804';
    ctx.fillText(txt,x+2,y+2);ctx.fillText(txt,x-1,y);ctx.fillText(txt,x+1,y);ctx.fillText(txt,x,y-1);ctx.fillStyle=col;ctx.fillText(txt,x,y);};
  if(!uiOpen&&G.target){const e=ens().find(x=>x.id===G.target&&!x.dead);if(e){const q=iso(e.rx,e.ry),s2=(CH[e.k].s||1);label(`${KINDS[e.k].name} ${e.hp}/${e.maxHp}`,(q.x+offX)*K,(q.y-(e.re||0)+offY-(SIZES[CH[e.k].t][3]*s2+26)*RES)*K,'#ff9a7a');}else G.target=null;}
  if(!uiOpen)PORTALS.forEach(P=>{if(cheb(P.x,P.y,p.x,p.y)<=5){const q=iso(P.x,P.y);label(P.name,(q.x+offX)*K,(q.y+offY-56*RES)*K,'#e0b8ff');}});
  if(!uiOpen)npcs().forEach(n=>{if(cheb(n.x,n.y,p.x,p.y)<=4){const q=iso(n.rx,n.ry);label(n.name,(q.x+offX)*K,(q.y+offY-34*RES)*K,'#e0d2b4');}});
  for(let i=floats.length-1;i>=0;i--){const f=floats[i],age=(now-f.born)/900;if(age>=1){floats.splice(i,1);continue;}if(age<0)continue;
    const q=iso(f.x,f.y);q.y-=elev(f.x,f.y);ctx.globalAlpha=1-age;label(f.text,(q.x+offX)*K,(q.y+offY-(36+age*12)*RES)*K,f.color,fs+2);}
  ctx.globalAlpha=1;
  if(G.title&&!uiOpen){const a=(now-G.title.t)/1000,al=a<.4?a/.4:a<2?1:Math.max(0,1-(a-2)/.8);
    if(al>0){ctx.globalAlpha=al;label(G.title.text,cw/2,ch*.3,'#f2b13c',Math.round(Math.min(cw,ch)/12));ctx.globalAlpha=1;}else if(a>3)G.title=null;}
}

let READY=false,SPGO=false;
function showSplash(replay){const sp=$('#splash');sp.hidden=false;sp.classList.remove('out','go');$('#overlay').hidden=true;uiOpen=true;SPGO=false;
  if(replay){const t=sp.querySelector('.sp-t');t.style.animation='none';void t.offsetWidth;t.style.animation='';}
  $('#spHint').textContent=READY?'Tippe, um zu beginnen':'Lade Welt …';}
function splashGo(){if(!READY||SPGO)return;SPGO=true;audioInit();jingle();const sp=$('#splash');sp.classList.add('go');
  setTimeout(()=>{sp.classList.add('out');intro();},RM?300:2600);setTimeout(()=>{sp.hidden=true;},RM?900:3500);}
$('#splash').addEventListener('click',splashGo);addEventListener('keydown',e=>{if(!$('#splash').hidden&&!SPGO&&READY&&(e.key==='Enter'||e.key===' ')){e.preventDefault();splashGo();}},true);
RSC=(GFXL[GFX]||GFXL.hoch)[1];resize();showZoom();showSplash();updateGfxBtn();
function prewarm(){try{initMtn();wildPool();['moor','frost','wueste','nebel'].forEach(z=>zonePool(z));['player','wolf','bandit','gerold','lene','odo','wache1','wache2'].forEach(k=>{for(let f=0;f<5;f++)charSprite(k,f);});
  ['wild','sonnwacht','grau','moor'].forEach(z=>{for(let v=0;v<4;v++)treeSprite(v,z);});
  if(!DECOK)buildDeco();/* Rev 92: Möbel, Truhen, Nischen usw. schon während des Titelbilds suchen */
  }catch(e){}}
setTimeout(()=>{genTextures();newGame();initRender();updateHUD();prewarm();requestAnimationFrame(loop);READY=true;if(!SPGO)$('#spHint').textContent='Tippe, um zu beginnen';
  let rs=false;try{rs=sessionStorage.getItem('grauufer-resume')==='1';sessionStorage.removeItem('grauufer-resume');}catch(e){}
  const sv=rs&&loadSave();if(sv){S=sv;S.p.face=S.p.face||1;migrate();initRender();SPGO=true;$('#splash').hidden=true;$('#overlay').hidden=true;uiOpen=false;updateHUD();G.fade=performance.now();log('Die Grafik wurde neu gestartet. Weiter geht es.','q');}},80);
</script>
